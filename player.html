<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임 플레이 | 3D 오락실</title>
<meta name="description" content="3D 오락실의 무료 웹게임을 브라우저에서 바로 플레이합니다. 설치도 회원가입도 필요 없습니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="3D 오락실 — 무료 브라우저 게임">
<meta property="og:description" content="설치 없이 브라우저에서 바로 즐기는 무료 3D 게임.">
<meta property="og:image" content="https://arcade3d.app/games/wing-dodge-3d/og-card.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="games/wing-dodge-3d/icon-600.png">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6240593008907807"
     crossorigin="anonymous"></script>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FQD6KVG3C0"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-FQD6KVG3C0');
</script>
<style>
  :root { --bar-h: 52px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d1a; }
  #bar {
    height: var(--bar-h);
    display: flex; align-items: center; gap: 14px;
    padding: 0 14px;
    background: #151832;
    border-bottom: 1px solid rgba(255,255,255,.08);
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
  }
  #back {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 16px; border-radius: 10px;
    background: rgba(55,230,255,.12);
    border: 1px solid rgba(55,230,255,.4);
    color: #37e6ff; font-weight: 700; font-size: 14px;
    text-decoration: none;
  }
  #back:hover { background: rgba(55,230,255,.22); }
  #title { color: #eef0ff; font-weight: 800; font-size: 16px; }
  #frame {
    display: block; border: 0;
    width: 100%; height: calc(100% - var(--bar-h));
  }
</style>
</head>
<body>
<div id="bar">
  <a id="back" href="index.html">← 오락실</a>
  <span id="title"></span>
</div>
<iframe id="frame" allow="fullscreen; autoplay"></iframe>

<script src="games.js"></script>
<script>
  const lang = arcadeGetLang();
  const ko = lang === 'ko';
  document.documentElement.lang = lang;
  document.getElementById('back').textContent = ko ? '← 오락실' : '← Arcade';

  const id = new URLSearchParams(location.search).get('game');
  const game = GAMES.find(g => g.id === id);
  if (game && game.path) {
    const title = ko ? game.title : (game.titleEn || game.title);
    document.getElementById('title').textContent = game.emoji + ' ' + title;
    document.title = title + (ko ? ' — 3D 오락실' : ' — Arcade3D');
    document.getElementById('frame').src = game.path;

    // 플레이 수 집계 — 실서비스 도메인에서만, 탭 세션당 게임별 1회
    try {
      if (location.hostname === 'arcade3d.app' && !sessionStorage.getItem('played-' + id)) {
        sessionStorage.setItem('played-' + id, '1');
        fetch(`${ARCADE_COUNTER}/hit/${ARCADE_COUNTER_NS}/${id}`).catch(() => {});
      }
    } catch (e) { /* 시크릿 모드 등에서 sessionStorage가 막혀도 게임은 정상 실행 */ }
  } else {
    location.replace('index.html');
  }
</script>
</body>
</html>
