<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #9ad2ef; touch-action: none; }

  /* ── 오버레이 ── */
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;

    z-index: 10; color: #fff; text-align: center; padding: 24px;
    animation: fadeIn .18s ease;

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .hidden { display: none !important; }

  .title {
    font-size: clamp(34px, 8vw, 54px); font-weight: 900; letter-spacing: -1px; line-height: 1.15;
    color: #fff;
  }
  .title em { font-style: normal; color: #7bd88f; }
  .subtitle { font-size: 14px; color: #9fb0c4; line-height: 1.75; }

  .btn {
    border: none; cursor: pointer; color: #08210f; font-weight: 800; font-size: 18px;
    padding: 14px 46px; border-radius: 14px; font-family: inherit;
    background: #7bd88f;
    transition: transform .1s, filter .12s;
  }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: scale(.97); }
  .btn.small {
    font-size: 14px; font-weight: 700; padding: 11px 30px; color: #dfe6ee;
    background: transparent; border: 1px solid rgba(255,255,255,.26);

  .btn.small:hover { background: rgba(255,255,255,.07); filter: none; }
  a.btn { text-decoration: none; display: inline-block; }
  .btnCol { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 6px; }

  .controls { font-size: 12.5px; color: #8a9ab0; line-height: 1.9; }
  .controls b { color: #dfe6ee; font-weight: 700; }
  #menuBest { font-size: 14px; color: #fff; font-weight: 700; }
  #menuBest:empty { display: none; }

  /* ── HUD ── */
  #hud { position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none; }
  #scoreNum {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    font-size: 44px; font-weight: 900; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.45);
  }
  #scoreNum.pop { animation: pop .25s ease; }
  @keyframes pop {
    0% { transform: translateX(-50%) scale(1); }
    40% { transform: translateX(-50%) scale(1.14); }
    100% { transform: translateX(-50%) scale(1); }
  }
  #lenTag {
    position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
    font-size: 12px; font-weight: 600; color: #b9c6d6; white-space: nowrap;
    text-shadow: 0 1px 4px rgba(0,0,0,.5);
  }

  .iconBtn {
    position: fixed; top: 12px; z-index: 6; pointer-events: auto;
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,.13);
    cursor: pointer; background: rgba(8,14,28,.5); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    transition: background .12s, transform .1s;
  }
  .iconBtn:hover { background: rgba(8,14,28,.75); }
  .iconBtn:active { transform: scale(.94); }
  #sndBtn { right: 12px; }
  #pauseBtn { right: 60px; }

  /* ── 회전 버튼 ── */
  #turnBar {
    position: fixed; bottom: 22px; left: 0; right: 0; z-index: 6;
    display: flex; justify-content: space-between; padding: 0 26px; pointer-events: none;
  }
  .turnBtn {
    pointer-events: auto; width: 76px; height: 76px; border-radius: 50%;
    border: 1px solid rgba(123,216,143,.4); background: rgba(123,216,143,.14);
    color: #7bd88f; font-size: 30px; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    transition: background .1s, transform .08s;
  }
  .turnBtn:active { background: rgba(123,216,143,.34); transform: scale(.93); }

  /* ── 게임오버 패널 ── */
  .panel {
    background: #101c2e; border: 1px solid rgba(255,255,255,.09);
    border-radius: 18px; padding: 30px 46px 26px;
    display: flex; flex-direction: column; align-items: center; gap: 9px;
    animation: panelIn .22s ease; max-width: min(92vw, 380px);
  }
  @keyframes panelIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .overLabel { font-size: 12px; font-weight: 700; letter-spacing: 3px; color: #8a9ab0; }
  #overScore { font-size: 56px; font-weight: 900; color: #fff; line-height: 1.1; }
  #overScore small { font-size: 20px; color: #9fb0c4; font-weight: 700; }
  #overBest { font-size: 14px; color: #9fb0c4; }
  #overBest b { color: #fff; }
  #overCause { font-size: 13px; color: #ff7a6b; font-weight: 700; }
  .newRecord { color: #7bd88f; font-weight: 800; }

  #radar {
    position: absolute; top: 12px; left: 12px;
    width: 96px; height: 96px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.13); background: rgba(8,14,28,.5);
  }

  #hint { position: fixed; bottom: 8px; left: 0; right: 0; text-align: center;
    z-index: 5; font-size: 11px; color: rgba(255,255,255,.45); pointer-events: none; }
</style>

  <button class="turnBtn" id="leftBtn" aria-label="왼쪽으로 회전"><svg width="30" height="30" viewBox="0 0 30 30" fill="none"><path d="M9 7a10 10 0 1 1-4 8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M9 2v6h6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

<script type="module">
import * as THREE from './three.module.js';

// ───────────────────────── 설정 ─────────────────────────
const N = 21;                 // 격자 한 변 (홀수여야 중앙 시작이 깔끔함)
const CELL = 1;               // 격자 한 칸 크기
const WALL_H = 1.2;           // 벽 높이
const STEP_MAX = 0.20;        // 이동 간격(초) — 속도는 끝까지 일정
const START_LEN = 4;
const CAM_DIST = 5.0, CAM_H = 8.2, CAM_LOOK = 4.5;   // 몸에 시야가 가리지 않도록 위에서 내려다보는 추적 시점
const LS_BEST = 'snake3d-best';
const LS_SND = 'snake3d-snd';

// 격자 좌표 → 월드 좌표
const wx = gx => (gx - (N - 1) / 2) * CELL;

// 방향: 0=북(-z), 1=동(+x), 2=남(+z), 3=서(-x)
const DIRS = [{ x: 0, z: -1 }, { x: 1, z: 0 }, { x: 0, z: 1 }, { x: -1, z: 0 }];

// ───────────────────────── 렌더러 ─────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ad2ef);
scene.fog = new THREE.Fog(0x9ad2ef, 22, 46);

const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8fca6a, 1.15));
const sun = new THREE.DirectionalLight(0xfff3da, 0.95);
sun.position.set(6, 14, 8);
scene.add(sun);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// ───────────────────────── 바닥 ─────────────────────────
function makeFloorTexture() {
  const S = 64, cv = document.createElement('canvas');
  cv.width = cv.height = S * 2;
  const g = cv.getContext('2d');
  const colors = ['#8fd05e', '#7bbf4d'];
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    g.fillStyle = colors[(i + j) % 2];
    g.fillRect(i * S, j * S, S, S);
  }
  g.strokeStyle = 'rgba(255,255,255,.14)';
  g.lineWidth = 2;
  g.strokeRect(0, 0, S, S); g.strokeRect(S, S, S, S);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(N / 2, N / 2);
  return tex;
}
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(N * CELL, N * CELL),
  new THREE.MeshStandardMaterial({ map: makeFloorTexture(), roughness: .95 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// ───────────────────────── 나무 울타리 ─────────────────────────
{
  const half = (N * CELL) / 2;
  const plankMat = new THREE.MeshStandardMaterial({ color: 0xb5854e, roughness: .85 });
  const railMat = new THREE.MeshStandardMaterial({ color: 0x96683a, roughness: .85 });
  const plankGeo = new THREE.BoxGeometry(0.6, 1.6, 0.12);
  const tipGeo = new THREE.ConeGeometry(0.34, 0.35, 4);

  // 네 변에 세로 판자 (끝은 뾰족하게)
  for (let i = -half + 0.55; i <= half - 0.55; i += 1.05) {
    const spots = [
      [i, -half - 0.2, 0], [i, half + 0.2, 0],
      [-half - 0.2, i, Math.PI / 2], [half + 0.2, i, Math.PI / 2],
    ];
    for (const [px, pz, rot] of spots) {
      const h = 1.5 + Math.random() * 0.18;
      const p = new THREE.Mesh(plankGeo, plankMat);
      p.scale.y = h / 1.6;
      p.position.set(px, h / 2, pz);
      p.rotation.y = rot;
      scene.add(p);
      const tip = new THREE.Mesh(tipGeo, plankMat);
      tip.position.set(px, h + 0.16, pz);
      tip.rotation.y = rot + Math.PI / 4;
      scene.add(tip);
    }
  }
  // 가로 레일 두 줄
  const railH = new THREE.BoxGeometry(N * CELL + 1.2, 0.15, 0.09);
  const railV = new THREE.BoxGeometry(0.09, 0.15, N * CELL + 1.2);
  for (const y of [0.55, 1.1]) {
    for (const z of [-half - 0.3, half + 0.3]) {
      const r = new THREE.Mesh(railH, railMat);
      r.position.set(0, y, z);
      scene.add(r);
    }
    for (const x of [-half - 0.3, half + 0.3]) {
      const r = new THREE.Mesh(railV, railMat);
      r.position.set(x, y, 0);
      scene.add(r);
    }
  }
  // 울타리 밖 잔디 마당
  const lawn = new THREE.Mesh(
    new THREE.PlaneGeometry(N * CELL * 3, N * CELL * 3),
    new THREE.MeshStandardMaterial({ color: 0x7fc251, roughness: .95 })
  );
  lawn.rotation.x = -Math.PI / 2;
  lawn.position.y = -0.02;
  scene.add(lawn);
  // 마당의 꽃 (흰 꽃잎 + 노란 중심)
  const petalMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .6 });
  const centerMat = new THREE.MeshStandardMaterial({ color: 0xffd54a, roughness: .5 });
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = half + 1.5 + Math.random() * 6;
    const fx = Math.cos(a) * r, fz = Math.sin(a) * r;
    const fl = new THREE.Group();
    const petal = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6), petalMat);
    petal.scale.y = 0.35;
    fl.add(petal);
    const ce = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), centerMat);
    ce.position.y = 0.05;
    fl.add(ce);
    fl.position.set(fx, 0.05, fz);
    scene.add(fl);
  }
}
// ───────────────────────── 뱀 (카툰 스타일) ─────────────────────────
// 등은 초록, 배는 주황 — 세로 그라데이션 텍스처로 투톤을 만든다
function twoToneTex(top, belly) {
  const cv = document.createElement('canvas');
  cv.width = 4; cv.height = 64;
  const g = cv.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 64);
  gr.addColorStop(0, top);
  gr.addColorStop(0.52, top);
  gr.addColorStop(0.72, belly);
  gr.addColorStop(1, belly);
  g.fillStyle = gr;
  g.fillRect(0, 0, 4, 64);
  return new THREE.CanvasTexture(cv);
}
const headMat  = new THREE.MeshStandardMaterial({ map: twoToneTex('#6ed584', '#f7b45c'), roughness: .55 });
const bodyMatA = new THREE.MeshStandardMaterial({ map: twoToneTex('#57c26f', '#f2a44a'), roughness: .6 });
const bodyMatB = new THREE.MeshStandardMaterial({ map: twoToneTex('#49ad60', '#e8983f'), roughness: .6 });
const bodyGeo = new THREE.SphereGeometry(0.47, 20, 14);
const headGeo = new THREE.SphereGeometry(0.5, 24, 16);

const headGroup = new THREE.Group();
let tongue;
{
  // 앞뒤로 길쭉한 머리
  const h = new THREE.Mesh(headGeo, headMat);
  h.scale.set(1, 0.85, 1.28);
  headGroup.add(h);

  // 왕눈이 — 흰자 크게 + 까만 동공
  for (const sx of [-1, 1]) {
    const white = new THREE.Mesh(new THREE.SphereGeometry(0.17, 14, 12),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .3 }));
    white.position.set(0.2 * sx, 0.3, -0.26);
    headGroup.add(white);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.085, 10, 8),
      new THREE.MeshBasicMaterial({ color: 0x1a1a1a }));
    pupil.position.set(0.21 * sx, 0.31, -0.4);
    headGroup.add(pupil);
  }

  // 콧구멍
  for (const sx of [-1, 1]) {
    const n2 = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 6), new THREE.MeshBasicMaterial({ color: 0x2a6b3c }));
    n2.position.set(0.1 * sx, 0.05, -0.62);
    headGroup.add(n2);
  }

  // 귀여운 송곳니 2개
  for (const sx of [-1, 1]) {
    const fang = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.13, 8),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .3 }));
    fang.rotation.x = Math.PI;
    fang.position.set(0.13 * sx, -0.2, -0.5);
    headGroup.add(fang);
  }

  // 빨간 스카프 (목도리 + 흘러내린 자락)
  const scarfMat = new THREE.MeshStandardMaterial({ color: 0xd94848, roughness: .7 });
  const scarf = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.14, 10, 22), scarfMat);
  scarf.rotation.x = Math.PI / 2;
  scarf.position.set(0, -0.12, 0.3);
  headGroup.add(scarf);
  const tail1 = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.3, 0.07), scarfMat);
  tail1.position.set(0.3, -0.32, 0.42);
  tail1.rotation.z = 0.25;
  headGroup.add(tail1);

  // 날름거리는 갈라진 혀
  tongue = new THREE.Group();
  const tm = new THREE.MeshBasicMaterial({ color: 0xff4d5e });
  const mid = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.3, 8), tm);
  mid.rotation.x = Math.PI / 2;
  mid.position.set(0, -0.1, -0.78);
  tongue.add(mid);
  for (const sx of [-1, 1]) {
    const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.008, 0.16, 8), tm);
    tip.rotation.x = Math.PI / 2;
    tip.rotation.y = sx * 0.45;
    tip.position.set(0.045 * sx, -0.1, -0.97);
    tongue.add(tip);
  }
  tongue.visible = false;
  headGroup.add(tongue);
}
headGroup.position.y = 0.42;
scene.add(headGroup);

const bodyPool = [];
function bodyMesh(i) {
  while (bodyPool.length <= i) {
    const m = new THREE.Mesh(bodyGeo, bodyPool.length % 2 ? bodyMatB : bodyMatA);
    m.position.y = 0.42;
    m.visible = false;
    scene.add(m);
    bodyPool.push(m);
  }
  return bodyPool[i];
}

// ───────────────────────── 먹이 (동시에 5개) ─────────────────────────
// 추적 시점이라 먹이가 화면 밖에 있을 수 있어, 각 먹이 위치에 빛기둥을 세운다
const FOOD_COUNT = 5;
const appleMat = new THREE.MeshStandardMaterial({ color: 0xe5484d, roughness: .35, emissive: 0x5c0f12 });
const stemMat = new THREE.MeshStandardMaterial({ color: 0x8a5a2b, roughness: .8 });
const leafMat = new THREE.MeshStandardMaterial({ color: 0x5cc46e, roughness: .6 });
const beamGeo = new THREE.CylinderGeometry(0.16, 0.3, 14, 12, 1, true);
function makeApple() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 12), appleMat);
  body.scale.y = 0.92;
  g.add(body);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.035, 0.16, 6), stemMat);
  stem.position.y = 0.35;
  stem.rotation.z = 0.2;
  g.add(stem);
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), leafMat);
  leaf.scale.set(1.6, 0.45, 0.9);
  leaf.position.set(0.13, 0.38, 0);
  leaf.rotation.z = 0.5;
  g.add(leaf);
  return g;
}
const foods = [];
for (let i = 0; i < FOOD_COUNT; i++) {
  const mesh = makeApple();
  mesh.position.y = 0.5;
  scene.add(mesh);
  const glow = new THREE.PointLight(0xff8a66, 1.1, 4.5);
  scene.add(glow);
  const beam = new THREE.Mesh(beamGeo, new THREE.MeshBasicMaterial({
    color: 0xff9a78, transparent: true, opacity: 0.18,
    depthWrite: false, side: THREE.DoubleSide,
  }));
  beam.position.y = 7;
  scene.add(beam);
  foods.push({ cell: { x: 0, z: 0 }, mesh, glow, beam, phase: Math.random() * Math.PI * 2 });
}

// ───────────────────────── 타격감: 스파크 & 카메라 흔들림 ─────────────────────────
const sparkGeo = new THREE.TetrahedronGeometry(0.09);
const sparks = [];
for (let i = 0; i < 48; i++) {
  const m = new THREE.Mesh(sparkGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true }));
  m.visible = false;
  scene.add(m);
  sparks.push({ mesh: m, vel: new THREE.Vector3(), life: 0 });
}
function burstAt(x, z, colorHex, n = 12, power = 1) {
  let used = 0;
  for (const s of sparks) {
    if (used >= n) break;
    if (s.life > 0) continue;
    used++;
    s.life = 1;
    s.mesh.visible = true;
    s.mesh.material.color.setHex(colorHex);
    s.mesh.position.set(x, 0.5, z);
    const a = Math.random() * Math.PI * 2;
    s.vel.set(
      Math.cos(a) * (1 + Math.random() * 2) * power,
      (2 + Math.random() * 3) * power,
      Math.sin(a) * (1 + Math.random() * 2) * power
    );
  }
}
let shake = 0;

// ───────────────────────── 사운드 ─────────────────────────
let sndOn = localStorage.getItem(LS_SND) !== '0';
let actx = null;
const sndBtn = document.getElementById('sndBtn');
const SND_ON_SVG = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 6v4h3l4 3V3L5 6H2z" fill="currentColor"/><path d="M11.5 5.5a3.5 3.5 0 0 1 0 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
const SND_OFF_SVG = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 6v4h3l4 3V3L5 6H2z" fill="currentColor"/><path d="M11 6l4 4M15 6l-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
function renderSnd() { sndBtn.innerHTML = sndOn ? SND_ON_SVG : SND_OFF_SVG; }
renderSnd();
sndBtn.addEventListener('click', () => {
  sndOn = !sndOn;
  localStorage.setItem(LS_SND, sndOn ? '1' : '0');
  renderSnd();
});
function beep(freq, dur, type = 'square', vol = 0.12, delay = 0) {
  if (!sndOn) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime + delay;
    const osc = actx.createOscillator(), g = actx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(actx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  } catch (e) {}
}
const SFX = {
  eat:  () => { beep(660, .09, 'sine', .16); beep(990, .12, 'sine', .14, .07); },
  turn: () => beep(300, .04, 'square', .05),
  die:  () => { beep(220, .18, 'sawtooth', .16); beep(140, .3, 'sawtooth', .14, .14); },
};

// ───────────────────────── 상태 ─────────────────────────
let cells = [];        // [{x,z}] 0=머리
let prevCells = [];
let dirIndex = 0;
let turnQueue = [];    // 회전 입력 큐 — 연타해도 순서대로 다 먹힌다 (최대 3개)
let score = 0, best = +(localStorage.getItem(LS_BEST) || 0);
let stepT = 0, stepDur = STEP_MAX;
let playing = false, paused = false, dead = false;
let deathT = 0;
const camForward = new THREE.Vector3(0, 0, -1);
const camTarget = new THREE.Vector3();

const el = id => document.getElementById(id);
const hud = el('hud'), turnBar = el('turnBar'), hint = el('hint');

// ── 레이더: 먹이와 내 위치·방향만 표시 (내 몸은 비밀 — 그게 이 게임의 긴장감) ──
const radarEl = el('radar');
const rctx = radarEl.getContext('2d');
function drawRadar() {
  const S = 96, k = S / N;
  rctx.clearRect(0, 0, S, S);
  rctx.strokeStyle = 'rgba(123,216,143,.35)';
  rctx.lineWidth = 1.5;
  rctx.strokeRect(1, 1, S - 2, S - 2);
  rctx.fillStyle = '#ff7a5c';
  for (const f of foods) {
    rctx.beginPath();
    rctx.arc((f.cell.x + 0.5) * k, (f.cell.z + 0.5) * k, 2.6, 0, Math.PI * 2);
    rctx.fill();
  }
  const h = cells[0];
  const hx = (h.x + 0.5) * k, hz = (h.z + 0.5) * k;
  const d = DIRS[dirIndex];
  rctx.strokeStyle = '#7bd88f';
  rctx.lineWidth = 2;
  rctx.beginPath();
  rctx.moveTo(hx, hz);
  rctx.lineTo(hx + d.x * 7, hz + d.z * 7);
  rctx.stroke();
  rctx.fillStyle = '#9cf0ab';
  rctx.beginPath();
  rctx.arc(hx, hz, 3.4, 0, Math.PI * 2);
  rctx.fill();
}

function randEmptyCell() {
  const taken = new Set(cells.map(c => c.x + ',' + c.z));
  for (const f of foods) taken.add(f.cell.x + ',' + f.cell.z);
  let tries = 0, c;
  do {
    c = { x: (Math.random() * N) | 0, z: (Math.random() * N) | 0 };
    tries++;
  } while (taken.has(c.x + ',' + c.z) && tries < 500);
  return c;
}

function reset() {
  const mid = (N - 1) >> 1;
  cells = [];
  for (let i = 0; i < START_LEN; i++) cells.push({ x: mid, z: mid + i });
  prevCells = cells.map(c => ({ ...c }));
  dirIndex = 0;
  turnQueue = [];
  score = 0;
  stepT = 0;
  stepDur = STEP_MAX;
  dead = false; deathT = 0;
  for (const f of foods) f.cell = { x: -1, z: -1 };
  for (const f of foods) f.cell = randEmptyCell();
  camForward.set(DIRS[dirIndex].x, 0, DIRS[dirIndex].z);
  const hp = new THREE.Vector3(wx(cells[0].x), 0.42, wx(cells[0].z));
  camera.position.set(hp.x - camForward.x * CAM_DIST, CAM_H, hp.z - camForward.z * CAM_DIST);
  camTarget.copy(hp);
  updateHUD();
}

function updateHUD() {
  el('scoreNum').textContent = score;
  el('lenTag').textContent = `길이 ${cells.length}` + (best ? ` · 최고 ${best}` : '');
}

// 회전이 대기 중이면 스텝을 앞당겨 입력이 밀리지 않게 한다
const stepInterval = () => (turnQueue.length ? stepDur * 0.55 : stepDur);

// ───────────────────────── 한 스텝 진행 ─────────────────────────
function step() {
  // 큐에서 회전 하나 꺼내 적용 (스텝당 하나 — 나머지는 다음 스텝에)
  if (turnQueue.length) {
    dirIndex = (dirIndex + turnQueue.shift() + 4) % 4;
  }
  const d = DIRS[dirIndex];
  const head = cells[0];
  const nx = head.x + d.x, nz = head.z + d.z;

  // 벽 충돌 → 즉사
  if (nx < 0 || nx >= N || nz < 0 || nz >= N) return die('벽에 부딪혔습니다');

  // 자기 몸 충돌 → 즉사 (꼬리 끝은 이번 스텝에 비워지므로 예외)
  const lastIdx = cells.length - 1;
  for (let i = 0; i < cells.length; i++) {
    if (cells[i].x === nx && cells[i].z === nz) {
      if (i === lastIdx) continue;   // 방금 빠져나갈 칸
      return die('자기 몸에 부딪혔습니다');
    }
  }

  prevCells = cells.map(c => ({ ...c }));
  const eatenFood = foods.find(f => f.cell.x === nx && f.cell.z === nz);
  const ate = !!eatenFood;
  cells.unshift({ x: nx, z: nz });
  if (!ate) cells.pop();
  else {
    score++;
    burstAt(wx(nx), wx(nz), 0xe5484d, 10);
    shake = Math.max(shake, 0.22);
    eatenFood.cell = randEmptyCell();   // 먹은 것만 새 자리에
    SFX.eat();
    el('scoreNum').classList.remove('pop');
    void el('scoreNum').offsetWidth;
    el('scoreNum').classList.add('pop');
  }
  updateHUD();
}

function die(cause) {
  dead = true; playing = false; deathT = 0;
  SFX.die();
  burstAt(wx(cells[0].x), wx(cells[0].z), 0x7bd88f, 24, 1.5);
  shake = 1;
  const isNew = score > best;
  if (isNew) { best = score; localStorage.setItem(LS_BEST, String(best)); }
  el('overCause').textContent = cause;
  el('overScore').innerHTML = `${score}<small> 점</small>`;
  el('overBest').innerHTML = isNew
    ? `<span class="newRecord">신기록</span>`
    : `최고 기록 <b>${best}</b>점`;
  hud.classList.add('hidden');
  turnBar.classList.add('hidden');
  hint.classList.add('hidden');
  el('pauseBtn').classList.add('hidden');
  setTimeout(() => el('over').classList.remove('hidden'), 620);
}

// ───────────────────────── 조작 ─────────────────────────
function turn(dir) {
  if (!playing || paused || dead) return;
  if (turnQueue.length < 2) { turnQueue.push(dir); SFX.turn(); }
}
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); turn(-1); }
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); turn(1); }
  else if (e.key === 'p' || e.key === 'P') togglePause();
});
el('leftBtn').addEventListener('pointerdown', e => { e.preventDefault(); turn(-1); });
el('rightBtn').addEventListener('pointerdown', e => { e.preventDefault(); turn(1); });
// 화면 좌우 절반 탭
canvas.addEventListener('pointerdown', e => {
  if (!playing || paused) return;
  turn(e.clientX < innerWidth / 2 ? -1 : 1);
});

function togglePause() {
  if (!playing || dead) return;
  paused = !paused;
  el('paused').classList.toggle('hidden', !paused);
}
el('pauseBtn').addEventListener('click', togglePause);
el('resumeBtn').addEventListener('click', togglePause);

function startGame() {
  reset();
  playing = true; paused = false;
  el('menu').classList.add('hidden');
  el('over').classList.add('hidden');
  el('paused').classList.add('hidden');
  hud.classList.remove('hidden');
  turnBar.classList.remove('hidden');
  el('pauseBtn').classList.remove('hidden');
  hint.classList.remove('hidden');
  setTimeout(() => hint.classList.add('hidden'), 3200);
}
function toMenu() {
  playing = false; paused = false; dead = false;
  el('over').classList.add('hidden');
  el('paused').classList.add('hidden');
  hud.classList.add('hidden');
  turnBar.classList.add('hidden');
  el('pauseBtn').classList.add('hidden');
  hint.classList.add('hidden');
  el('menu').classList.remove('hidden');
  showMenuBest();
}
el('startBtn').addEventListener('click', startGame);
el('retryBtn').addEventListener('click', startGame);
el('menuBtn').addEventListener('click', toMenu);
el('pauseMenuBtn').addEventListener('click', toMenu);

function showMenuBest() {
  el('menuBest').textContent = best ? `최고 기록 ${best}점` : '';
}
showMenuBest();

// ───────────────────────── 렌더 루프 ─────────────────────────
const HEADLESS = new URLSearchParams(location.search).has('headless');
const schedule = HEADLESS ? (cb => setTimeout(() => cb(performance.now()), 16)) : (cb => requestAnimationFrame(cb));

const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
let last = performance.now();

function draw(now) {
  schedule(draw);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (playing && !paused && !dead) {
    stepT += dt;
    let iv = stepInterval();
    while (stepT >= iv && playing) {
      stepT -= iv;
      step();
      iv = stepInterval();
    }
  }
  if (dead) deathT += dt;

  const t = playing && !paused ? Math.min(1, stepT / stepInterval()) : (dead ? 1 : 0);

  // 뱀 몸 위치 (이전 칸 → 현재 칸 보간)
  const n = cells.length;
  for (let i = 0; i < bodyPool.length; i++) bodyPool[i].visible = false;
  let headX = 0, headZ = 0;
  for (let i = 0; i < n; i++) {
    const cur = cells[i];
    const pv = prevCells[Math.min(i, prevCells.length - 1)] || cur;
    const px = wx(pv.x) + (wx(cur.x) - wx(pv.x)) * t;
    const pz = wx(pv.z) + (wx(cur.z) - wx(pv.z)) * t;
    if (i === 0) {
      headX = px; headZ = pz;
    } else {
      const m = bodyMesh(i - 1);
      m.visible = true;
      m.position.set(px, 0.42, pz);
      const s = 1 - 0.3 * (i / n);   // 꼬리로 갈수록 가늘게
      m.scale.setScalar(s);
    }
  }

  // 머리
  const d = DIRS[dirIndex];
  headGroup.position.set(headX, dead ? 0.5 - Math.min(0.3, deathT * 0.7) : 0.5, headZ);
  const targetYaw = Math.atan2(d.x, d.z) + Math.PI;
  let yaw = headGroup.rotation.y;
  let diff = ((targetYaw - yaw + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  headGroup.rotation.y = yaw + diff * Math.min(1, dt * 14);
  // 죽으면 옆으로 툭 쓰러진다 (90°에서 멈춤 — 뱅글뱅글 돌지 않게)
  headGroup.rotation.z = dead ? Math.min(Math.PI / 2, deathT * 2.6) : 0;

  // 혀 날름 — 2.4초마다 잠깐 내밀었다 넣는다
  {
    const cyc = now % 2400;
    const out = !dead && playing && cyc < 300;
    tongue.visible = out;
    if (out) tongue.position.z = -Math.sin(cyc / 300 * Math.PI) * 0.16;
  }

  // 먹이 연출
  for (const f of foods) {
    f.mesh.position.set(wx(f.cell.x), 0.5 + Math.sin(now / 320 + f.phase) * 0.1, wx(f.cell.z));
    f.mesh.rotation.y += dt * 1.4;
    f.glow.position.copy(f.mesh.position);
    f.beam.position.set(wx(f.cell.x), 7, wx(f.cell.z));
    f.beam.material.opacity = 0.13 + Math.sin(now / 260 + f.phase) * 0.05;
  }

  // 카메라: 뱀 뒤를 부드럽게 추적
  tmpA.set(d.x, 0, d.z);
  camForward.lerp(tmpA, 1 - Math.pow(0.0006, dt)).normalize();
  const desiredX = headX - camForward.x * CAM_DIST;
  const desiredZ = headZ - camForward.z * CAM_DIST;
  tmpB.set(desiredX, CAM_H, desiredZ);
  camera.position.lerp(tmpB, 1 - Math.pow(0.0015, dt));
  tmpB.set(headX + camForward.x * CAM_LOOK, 0, headZ + camForward.z * CAM_LOOK);
  camTarget.lerp(tmpB, 1 - Math.pow(0.0015, dt));
  camera.lookAt(camTarget);

  // 카메라 흔들림 (먹으면 살짝, 죽으면 크게)
  if (shake > 0) {
    shake = Math.max(0, shake - dt * 2.4);
    camera.position.x += (Math.random() - 0.5) * shake * 0.9;
    camera.position.y += (Math.random() - 0.5) * shake * 0.55;
    camera.position.z += (Math.random() - 0.5) * shake * 0.9;
  }

  // 스파크 파티클
  for (const s of sparks) {
    if (s.life <= 0) continue;
    s.life -= dt * 1.8;
    if (s.life <= 0) { s.mesh.visible = false; continue; }
    s.vel.y -= 12 * dt;
    s.mesh.position.addScaledVector(s.vel, dt);
    if (s.mesh.position.y < 0.06) {
      s.mesh.position.y = 0.06;
      s.vel.y *= -0.4; s.vel.x *= 0.8; s.vel.z *= 0.8;
    }
    s.mesh.scale.setScalar(Math.max(0.05, s.life) * 1.4);
    s.mesh.material.opacity = s.life;
    s.mesh.rotation.x += dt * 7;
    s.mesh.rotation.y += dt * 9;
  }

  if (!hud.classList.contains('hidden')) drawRadar();

  renderer.render(scene, camera);
}

reset();
hud.classList.add('hidden');
schedule(draw);

// 자동 테스트용 훅
window.__snake = {
  start: startGame,
  turn,
  state: () => ({ score, len: cells.length, dead, playing, head: cells[0], dir: dirIndex, foods: foods.map(f => ({ ...f.cell })) }),
};
</script>
</body>
</html>
