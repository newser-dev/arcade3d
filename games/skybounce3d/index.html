<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #7ec8e3; touch-action: none; }
  body { font-family: 'Pretendard', 'Segoe UI', 'Malgun Gothic', sans-serif; user-select: none; -webkit-user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ── 오버레이 공통 ── */
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: rgba(10, 15, 26, .78);
    z-index: 10; color: #fff; text-align: center; padding: 24px;
    animation: fadeIn .18s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .hidden { display: none !important; }

  /* ── 타이틀 ── */
  .title {
    font-size: clamp(34px, 8vw, 52px); font-weight: 900; letter-spacing: -1px;
    color: #fff; line-height: 1.15;
  }
  .title em { font-style: normal; color: #ff5a3c; }
  .subtitle { font-size: 14px; color: #aab6c6; line-height: 1.75; }

  /* ── 버튼 ── */
  .btn {
    border: none; cursor: pointer; color: #fff; font-weight: 800; font-size: 17px;
    padding: 14px 46px; border-radius: 14px;
    background: #ff5a3c;
    transition: transform .1s, filter .12s;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: scale(.97); }
  .btn.small {
    font-size: 14px; font-weight: 700; padding: 11px 30px;
    background: transparent; border: 1px solid rgba(255,255,255,.28); color: #dfe6ee;
  }
  .btn.small:hover { background: rgba(255,255,255,.06); filter: none; }
  a.btn { text-decoration: none; display: inline-block; }
  .btnCol { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 8px; }

  /* ── 메뉴 ── */
  .legend { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; font-size: 12px; color: #aab6c6; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  .controls { font-size: 12.5px; color: #8fa0b4; line-height: 1.8; }
  .controls b { color: #dfe6ee; font-weight: 700; }

  #menuBest { font-size: 14px; color: #fff; font-weight: 700; }
  #menuBest:empty { display: none; }

  /* ── HUD ── */
  #hud { position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none; }
  #floorNum {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    font-size: 44px; font-weight: 900; color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  #floorNum small { font-size: 18px; font-weight: 700; color: #eef2f7; }
  #floorNum.pop { animation: floorPop .25s ease; }
  @keyframes floorPop {
    0% { transform: translateX(-50%) scale(1); }
    40% { transform: translateX(-50%) scale(1.1); }
    100% { transform: translateX(-50%) scale(1); }
  }
  #bestTag {
    position: absolute; top: 66px; left: 50%; transform: translateX(-50%);
    font-size: 12px; font-weight: 600; color: #d4dde7;
    text-shadow: 0 1px 4px rgba(0,0,0,.45); white-space: nowrap;
  }
  #bestTag:empty { display: none; }

  /* 층 돌파 토스트 */
  #toast {
    position: fixed; top: 27%; left: 50%; transform: translateX(-50%);
    z-index: 7; pointer-events: none; font-size: 21px; font-weight: 800; color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,.4);
    opacity: 0; white-space: nowrap;
  }
  #toast.show { animation: toastUp 1.4s ease forwards; }
  @keyframes toastUp {
    0% { opacity: 0; transform: translate(-50%, 10px); }
    15% { opacity: 1; transform: translate(-50%, 0); }
    75% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -16px); }
  }

  /* 우상단 아이콘 버튼 */
  .iconBtn {
    position: fixed; top: 12px; z-index: 6; pointer-events: auto;
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12);
    cursor: pointer; background: rgba(10,15,26,.45); color: #fff;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s, transform .1s;
  }
  .iconBtn:hover { background: rgba(10,15,26,.7); }
  .iconBtn:active { transform: scale(.94); }
  #sndBtn { right: 12px; }
  #pauseBtn { right: 60px; }

  /* ── 게임오버 패널 ── */
  .panel {
    background: #111a29; border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px; padding: 32px 48px 28px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    animation: panelIn .22s ease;
    max-width: min(92vw, 380px);
  }
  @keyframes panelIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .overLabel { font-size: 13px; font-weight: 700; letter-spacing: 3px; color: #8fa0b4; }
  #overScore { font-size: 58px; font-weight: 900; color: #fff; line-height: 1.1; }
  #overScore small { font-size: 22px; color: #aab6c6; font-weight: 700; }
  #overBest { font-size: 14px; color: #aab6c6; }
  #overBest b { color: #fff; }
  .newRecord { color: #ff5a3c; font-weight: 800; }

  /* ── 조이스틱 / 힌트 ── */
  #joyBase {
    position: fixed; z-index: 4; width: 96px; height: 96px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.55); background: rgba(255,255,255,.12);
    pointer-events: none; display: none;
  }
  #joyNub {
    position: fixed; z-index: 4; width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255,255,255,.75); pointer-events: none; display: none;
  }
  #pauseHint { position: fixed; bottom: 10px; right: 14px; z-index: 5; font-size: 11px; color: rgba(255,255,255,.55); pointer-events: none; }

<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">

<script type="module">
import * as THREE from './three.module.js';

// ───────────────────────── 기본 설정 ─────────────────────────
// ?headless=1 : 화면 비표시 환경(자동 테스트)에서도 루프를 돌리기 위한 개발용 스위치
const HEADLESS = new URLSearchParams(location.search).has('headless');
const schedule = HEADLESS ? (cb => setTimeout(() => cb(performance.now()), 16)) : (cb => requestAnimationFrame(cb));
const AREA = 8;            // 이동 가능 영역 절반 (x, z)
const GRAV = 26;
const BOUNCE_V = 15.2;     // 일반 바운스 (점프 높이 ≈ 4.4)
const SPRING_V = 24;       // 스프링 바운스
const MOVE_SPEED = 9;      // 공 수평 최고 속도
const FLOOR_H = 3;         // 1층 = 3유닛
const BALL_R = 0.5;
const LS_BEST = 'skybounce3d-best';
const LS_SND = 'skybounce3d-snd';

// ───────────────────────── 렌더러 / 씬 ─────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 300);

const SKY_LOW = new THREE.Color(0x7ec8e3);
const SKY_HIGH = new THREE.Color(0x0b1440);
scene.background = SKY_LOW.clone();
scene.fog = new THREE.Fog(SKY_LOW.clone(), 40, 120);

const hemi = new THREE.HemisphereLight(0xffffff, 0x88aacc, 1.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(6, 12, 8);
scene.add(sun);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// ───────────────────────── 공 ─────────────────────────
const ballGroup = new THREE.Group();
const ballMat = new THREE.MeshStandardMaterial({ color: 0xff5a3c, roughness: 0.35, metalness: 0.1 });
const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 24, 18), ballMat);
ballGroup.add(ballMesh);
// 공 위 흰 줄무늬 (원작 바운드볼 느낌)
const stripe = new THREE.Mesh(
  new THREE.TorusGeometry(BALL_R * 0.98, 0.07, 8, 32),
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 })
);
stripe.rotation.x = Math.PI / 2;
ballMesh.add(stripe);
scene.add(ballGroup);

// 그림자(블롭)
const shadowMesh = new THREE.Mesh(
  new THREE.CircleGeometry(0.55, 24),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3, depthWrite: false })
);
shadowMesh.rotation.x = -Math.PI / 2;
scene.add(shadowMesh);

// ───────────────────────── 발판 ─────────────────────────
const PLAT = { NORMAL: 0, CRUMBLE: 1, SPRING: 2, MOVING: 3, SPIKE: 4 };
const PLAT_COLOR = {
  [PLAT.NORMAL]: 0x58c96b,
  [PLAT.CRUMBLE]: 0xf2a13c,
  [PLAT.SPRING]: 0xb06df2,
  [PLAT.MOVING]: 0x4fa8f2,
  [PLAT.SPIKE]: 0xe84f4f,
};
const platGeo = new THREE.BoxGeometry(3, 0.5, 3);

// ── 블록 비주얼: 밝은 윗면 타일 + 어두운 옆면 투톤, 종류별 윗면 무늬 ──
function shade(hex, f) {
  const c = new THREE.Color(hex);
  c.multiplyScalar(f);
  return c;
}
function topTexture(hex, drawFn) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  g.fillStyle = '#' + new THREE.Color(hex).getHexString();
  g.fillRect(0, 0, 128, 128);
  // 안쪽 라운드 테두리 → 타일 느낌
  g.strokeStyle = 'rgba(255,255,255,.26)';
  g.lineWidth = 5;
  g.beginPath();
  g.roundRect(7, 7, 114, 114, 14);
  g.stroke();
  if (drawFn) drawFn(g);
  const tx = new THREE.CanvasTexture(cv);
  tx.anisotropy = 4;
  return tx;
}
const TOP_DRAW = {
  [PLAT.CRUMBLE]: g => {             // 금 간 무늬
    g.strokeStyle = 'rgba(90,45,0,.38)'; g.lineWidth = 3; g.lineCap = 'round';
    g.beginPath();
    g.moveTo(64, 16); g.lineTo(52, 50); g.lineTo(72, 66); g.lineTo(58, 104);
    g.moveTo(52, 50); g.lineTo(20, 62);
    g.moveTo(72, 66); g.lineTo(106, 80);
    g.stroke();
  },
  [PLAT.MOVING]: g => {              // 이동 방향 화살표
    g.fillStyle = 'rgba(255,255,255,.42)';
    g.beginPath(); g.moveTo(18, 64); g.lineTo(38, 47); g.lineTo(38, 81); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(110, 64); g.lineTo(90, 47); g.lineTo(90, 81); g.closePath(); g.fill();
  },
  [PLAT.SPIKE]: g => {               // 위험 사선
    g.strokeStyle = 'rgba(0,0,0,.2)'; g.lineWidth = 7;
    for (let i = -128; i < 256; i += 28) {
      g.beginPath(); g.moveTo(i, 128); g.lineTo(i + 128, 0); g.stroke();
    }
  },
};
const platMats = {};                 // type → [+x, -x, 윗면, 바닥, +z, -z]
for (const k in PLAT_COLOR) {
  const side = new THREE.MeshStandardMaterial({ color: shade(PLAT_COLOR[k], 0.62), roughness: 0.7 });
  const bottom = new THREE.MeshStandardMaterial({ color: shade(PLAT_COLOR[k], 0.45), roughness: 0.8 });
  const top = new THREE.MeshStandardMaterial({ map: topTexture(PLAT_COLOR[k], TOP_DRAW[k]), roughness: 0.55 });
  platMats[k] = [side, side, top, bottom, side, side];
}

const spikeGeo = new THREE.ConeGeometry(0.2, 0.5, 6);
const spikeMat = new THREE.MeshStandardMaterial({ color: 0xb92f2f, roughness: 0.35, metalness: 0.15 });

// 스프링 = 점프대: 코일 3링 + 윗판 (공과 같은 색 → "여기서 튄다"는 신호)
const coilMat = new THREE.MeshStandardMaterial({ color: 0xdfe6ee, roughness: 0.35, metalness: 0.35 });
const capMat = new THREE.MeshStandardMaterial({ color: 0xff5a3c, roughness: 0.45 });
function makeSpring() {
  const g = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.055, 8, 20), coilMat);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.08 + i * 0.14;
    g.add(ring);
  }
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.4, 0.1, 16), capMat);
  cap.position.y = 0.46;
  g.add(cap);
  return g;
}

let platforms = [];

function makePlatform(type, x, y, z) {
  const mesh = new THREE.Mesh(platGeo, platMats[type]);
  mesh.position.set(x, y, z);
  if (type === PLAT.SPIKE) {
    for (let i = 0; i < 9; i++) {
      const s = new THREE.Mesh(spikeGeo, spikeMat);
      s.position.set(((i % 3) - 1) * 0.9, 0.5, (Math.floor(i / 3) - 1) * 0.9);
      mesh.add(s);
    }
  } else if (type === PLAT.SPRING) {
    const s = makeSpring();
    s.position.y = 0.25;
    mesh.add(s);
    mesh.userData.springMesh = s;
  }
  scene.add(mesh);
  const p = {
    type, mesh, x, y, z, hx: 1.5, hz: 1.5,
    alive: true, breaking: 0,
    moveDir: Math.random() < 0.5 ? 1 : -1,
    moveSpd: 0, moveAxis: Math.random() < 0.5 ? 'x' : 'z',
    baseX: x, baseZ: z, phase: Math.random() * Math.PI * 2,
  };
  if (type === PLAT.MOVING && p.moveAxis === 'z') mesh.rotation.y = Math.PI / 2; // 화살표를 이동축에 정렬
  platforms.push(p);
  return p;
}

// ───────────────────────── 구름 / 별 ─────────────────────────
const clouds = [];
const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
function makeCloud(y) {
  const g = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(1.2 + Math.random(), 10, 8), cloudMat);
    s.position.set(i * 1.6 - 1.6, Math.random() * 0.4, Math.random() * 0.8);
    s.scale.y = 0.55;
    g.add(s);
  }
  g.position.set((Math.random() - 0.5) * 50, y, -14 - Math.random() * 25);
  scene.add(g);
  clouds.push(g);
}
for (let i = 0; i < 10; i++) makeCloud(Math.random() * 40);

const starGeo = new THREE.BufferGeometry();
{
  const pos = new Float32Array(300 * 3);
  for (let i = 0; i < 300; i++) {
    pos[i * 3] = (Math.random() - 0.5) * 160;
    pos[i * 3 + 1] = (Math.random() - 0.5) * 160;
    pos[i * 3 + 2] = -40 - Math.random() * 60;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
}
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0 });
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ───────────────────────── 파티클 ─────────────────────────
const particles = [];
const partGeo = new THREE.SphereGeometry(0.09, 6, 5);
function burst(x, y, z, color, n = 8, spd = 4) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(partGeo, new THREE.MeshBasicMaterial({ color, transparent: true }));
    m.position.set(x, y, z);
    const a = Math.random() * Math.PI * 2;
    m.userData.v = new THREE.Vector3(Math.cos(a) * spd * Math.random(), 2 + Math.random() * 3, Math.sin(a) * spd * Math.random());
    m.userData.life = 0.6;
    scene.add(m);
    particles.push(m);
  }
}

// ───────────────────────── 사운드 ─────────────────────────
let sndOn = localStorage.getItem(LS_SND) !== '0';
let actx = null;
function beep(freq, dur, type = 'sine', vol = 0.15, slide = 0) {
  if (!sndOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, actx.currentTime + dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  bounce: () => beep(340, 0.09, 'sine', 0.12, 160),
  spring: () => beep(420, 0.25, 'square', 0.08, 500),
  crumble: () => beep(200, 0.12, 'triangle', 0.12, -80),
  die: () => beep(300, 0.6, 'sawtooth', 0.12, -260),
  ui: () => beep(600, 0.06, 'sine', 0.1),
};
const sndBtn = document.getElementById('sndBtn');
const SVG_SND_ON = '<svg width="17" height="17" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#fff"/><path d="M16 8.5a5 5 0 0 1 0 7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const SVG_SND_OFF = '<svg width="17" height="17" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#fff" opacity=".55"/><path d="M16 9.5l5 5M21 9.5l-5 5" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".55"/></svg>';
function updSndBtn() { sndBtn.innerHTML = sndOn ? SVG_SND_ON : SVG_SND_OFF; }
sndBtn.addEventListener('click', () => {
  sndOn = !sndOn;
  localStorage.setItem(LS_SND, sndOn ? '1' : '0');
  updSndBtn(); sfx.ui();
});
updSndBtn();

// ───────────────────────── 입력 ─────────────────────────
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyP' && state === 'playing') pauseGame();
  else if (e.code === 'KeyP' && state === 'paused') resumeGame();
  if ((e.code === 'Space' || e.code === 'Enter')) {
    if (state === 'menu') startGame();
    else if (state === 'over' && overReady) startGame();
  }
});
addEventListener('keyup', e => keys[e.code] = false);

// 가상 조이스틱
const joyBase = document.getElementById('joyBase');
const joyNub = document.getElementById('joyNub');
let joy = null; // {id, ox, oy, dx, dy}
function joyShow(x, y) {
  joyBase.style.display = joyNub.style.display = 'block';
  joyBase.style.left = (x - 48) + 'px'; joyBase.style.top = (y - 48) + 'px';
  joyNubTo(x, y);
}
function joyNubTo(x, y) { joyNub.style.left = (x - 21) + 'px'; joyNub.style.top = (y - 21) + 'px'; }
function joyHide() { joyBase.style.display = joyNub.style.display = 'none'; }
canvas.addEventListener('pointerdown', e => {
  if (state !== 'playing') return;
  joy = { id: e.pointerId, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0 };
  joyShow(e.clientX, e.clientY);
});
addEventListener('pointermove', e => {
  if (!joy || e.pointerId !== joy.id) return;
  const R = 55;
  let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy;
  const len = Math.hypot(dx, dy);
  if (len > R) { dx = dx / len * R; dy = dy / len * R; }
  joy.dx = dx / R; joy.dy = dy / R;
  joyNubTo(joy.ox + dx, joy.oy + dy);
});
function joyEnd(e) { if (joy && e.pointerId === joy.id) { joy = null; joyHide(); } }
addEventListener('pointerup', joyEnd);
addEventListener('pointercancel', joyEnd);

function inputVector() {
  let ix = 0, iz = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) ix -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) ix += 1;
  if (keys['ArrowUp'] || keys['KeyW']) iz -= 1;
  if (keys['ArrowDown'] || keys['KeyS']) iz += 1;
  if (joy) { ix += joy.dx; iz += joy.dy; }
  const len = Math.hypot(ix, iz);
  if (len > 1) { ix /= len; iz /= len; }
  return [ix, iz];
}

// ───────────────────────── 게임 상태 ─────────────────────────
let state = 'menu'; // menu | playing | paused | over
let ball, maxY, camY, nextSpawnY, lastSafe, dead, deadTimer, squash, shake;
let best = parseInt(localStorage.getItem(LS_BEST) || '0');
let overReady = false;

const $ = id => document.getElementById(id);
const menuEl = $('menu'), overEl = $('over'), pausedEl = $('paused'), hudEl = $('hud');

function clearPlatforms() {
  for (const p of platforms) scene.remove(p.mesh);
  platforms = [];
  for (const m of particles) scene.remove(m);
  particles.length = 0;
}

function difficulty(h) {
  // h: 현재 높이(유닛). 높이에 따라 어려워짐
  return {
    gap: 2.6 + Math.min(1.3, h / 220),                    // 발판 세로 간격
    crumbleP: Math.min(0.32, h / 320),                    // 1회용 확률
    movingP: Math.min(0.30, 0.04 + h / 400),              // 이동 발판 확률
    springP: 0.08,
    spikeP: h > 45 ? Math.min(0.35, (h - 45) / 260) : 0,  // 가시(추가 발판에만)
    moveSpd: 2 + Math.min(3.5, h / 140),
  };
}

function spawnLevel(y) {
  const d = difficulty(y);
  // 이전 안전 발판에서 닿을 수 있는 위치에 안전 발판 1개 보장
  const ang = Math.random() * Math.PI * 2;
  const dist = 2 + Math.random() * 4.5;
  let x = THREE.MathUtils.clamp(lastSafe.x + Math.cos(ang) * dist, -AREA + 1.5, AREA - 1.5);
  let z = THREE.MathUtils.clamp(lastSafe.z + Math.sin(ang) * dist, -AREA + 1.5, AREA - 1.5);
  let type = PLAT.NORMAL;
  const r = Math.random();
  if (r < d.springP) type = PLAT.SPRING;
  else if (r < d.springP + d.movingP) type = PLAT.MOVING;
  else if (r < d.springP + d.movingP + d.crumbleP) type = PLAT.CRUMBLE;
  const p = makePlatform(type, x, y, z);
  if (type === PLAT.MOVING) p.moveSpd = d.moveSpd;
  lastSafe = { x, z };

  // 추가 발판 (가시일 수도 있음)
  if (Math.random() < 0.55) {
    let ex = (Math.random() - 0.5) * 2 * (AREA - 1.5);
    let ez = (Math.random() - 0.5) * 2 * (AREA - 1.5);
    if (Math.hypot(ex - x, ez - z) > 3.4) {
      const et = Math.random() < d.spikeP ? PLAT.SPIKE : PLAT.NORMAL;
      makePlatform(et, ex, y + (Math.random() - 0.5) * 0.8, ez);
    }
  }
}

function resetGame() {
  clearPlatforms();
  ball = { x: 0, y: 1.2, z: 0, vx: 0, vy: BOUNCE_V, vz: 0, spin: 0 };
  maxY = 0; camY = 0; dead = false; deadTimer = 0; squash = 0; shake = 0;
  lastSafe = { x: 0, z: 0 };
  overReady = false;
  lastFloorShown = -1; lastMilestone = 0;
  // 시작 발판 (넓음)
  const base = makePlatform(PLAT.NORMAL, 0, 0, 0);
  base.mesh.scale.set(3, 1, 3); base.hx = 4.5; base.hz = 4.5;
  nextSpawnY = FLOOR_H;
  while (nextSpawnY < 45) { spawnLevel(nextSpawnY); nextSpawnY += difficulty(nextSpawnY).gap; }
  updateHUD();
}

function startGame() {
  sfx.ui();
  resetGame();
  state = 'playing';
  menuEl.classList.add('hidden');
  overEl.classList.add('hidden');
  hudEl.classList.remove('hidden');
  $('pauseHint').classList.remove('hidden');
  $('pauseBtn').classList.remove('hidden');
}

function gameOver() {
  state = 'over';
  const floor = Math.floor(maxY / FLOOR_H);
  const isNew = floor > best;
  if (isNew) { best = floor; localStorage.setItem(LS_BEST, String(best)); }
  $('overScore').innerHTML = floor + '<small>층</small>';
  $('overBest').innerHTML = isNew
    ? '<span class="newRecord">신기록</span>'
    : `최고 기록 <b>${best}층</b>`;
  hudEl.classList.add('hidden');
  $('pauseHint').classList.add('hidden');
  $('pauseBtn').classList.add('hidden');
  joy = null; joyHide();
  overEl.classList.remove('hidden');
  overReady = false;
  setTimeout(() => overReady = true, 400); // 연타 방지
}

function pauseGame() { state = 'paused'; pausedEl.classList.remove('hidden'); }
function resumeGame() { state = 'playing'; pausedEl.classList.add('hidden'); lastT = performance.now(); }

$('startBtn').addEventListener('click', startGame);
$('retryBtn').addEventListener('click', () => { if (overReady) startGame(); });
$('menuBtn').addEventListener('click', () => {
  sfx.ui();
  state = 'menu';
  overEl.classList.add('hidden');
  showMenu();
});
$('resumeBtn').addEventListener('click', () => { sfx.ui(); resumeGame(); });
$('pauseBtn').addEventListener('click', () => { if (state === 'playing') { sfx.ui(); pauseGame(); } });
$('pausedMenuBtn').addEventListener('click', () => {
  sfx.ui();
  state = 'menu';
  pausedEl.classList.add('hidden');
  hudEl.classList.add('hidden');
  $('pauseHint').classList.add('hidden');
  $('pauseBtn').classList.add('hidden');
  joy = null; joyHide();
  showMenu();
});
document.addEventListener('visibilitychange', () => {
  if (!HEADLESS && document.hidden && state === 'playing') pauseGame();
});

function showMenu() {
  $('menuBest').textContent = best > 0 ? `최고 기록 ${best}층` : '';
  menuEl.classList.remove('hidden');
}

// 층수 팝 애니메이션 + 층 돌파 토스트
let lastFloorShown = -1;
let lastMilestone = 0;
const MILESTONES = [10, 25, 50, 100, 150, 200, 300];

function showToast(msg) {
  const tEl = $('toast');
  tEl.textContent = msg;
  tEl.classList.remove('show'); void tEl.offsetWidth; tEl.classList.add('show');
}

function updateHUD() {
  const floor = Math.floor(maxY / FLOOR_H);
  if (floor !== lastFloorShown) {
    $('floorNum').innerHTML = floor + '<small>층</small>';
    if (floor > lastFloorShown && lastFloorShown >= 0) {
      const fn = $('floorNum');
      fn.classList.remove('pop'); void fn.offsetWidth; fn.classList.add('pop');
    }
    lastFloorShown = floor;
    for (const m of MILESTONES) {
      if (floor >= m && lastMilestone < m) {
        lastMilestone = m;
        showToast(`${m}층`);
      }
    }
  }
  $('bestTag').textContent = (best > 0 && floor > best) ? '신기록 경신 중' : (best > 0 ? `최고 ${best}층` : '');
}

// ───────────────────────── 게임 루프 ─────────────────────────
let lastT = performance.now();

function tick(now) {
  schedule(tick);
  let dt = Math.min((now - lastT) / 1000, 0.033);
  lastT = now;
  if (state === 'paused') return;

  const playing = state === 'playing';

  if (playing && !dead) {
    // 이동 입력
    const [ix, iz] = inputVector();
    ball.vx += (ix * MOVE_SPEED - ball.vx) * Math.min(1, 8 * dt);
    ball.vz += (iz * MOVE_SPEED - ball.vz) * Math.min(1, 8 * dt);

    // 물리
    ball.vy -= GRAV * dt;
    const prevY = ball.y;
    ball.x = THREE.MathUtils.clamp(ball.x + ball.vx * dt, -AREA, AREA);
    ball.z = THREE.MathUtils.clamp(ball.z + ball.vz * dt, -AREA, AREA);
    ball.y += ball.vy * dt;

    // 발판 충돌 (하강 중일 때만)
    if (ball.vy < 0) {
      for (const p of platforms) {
        if (!p.alive) continue;
        const top = p.y + 0.25;
        if (prevY - BALL_R >= top - 0.05 && ball.y - BALL_R <= top &&
            Math.abs(ball.x - p.x) <= p.hx + BALL_R * 0.5 &&
            Math.abs(ball.z - p.z) <= p.hz + BALL_R * 0.5) {
          if (p.type === PLAT.SPIKE) {
            // 가시! 죽음
            dead = true; deadTimer = 0;
            ball.vy = 6; ball.vx *= 0.3; ball.vz *= 0.3;
            ballMat.color.set(0x888888);
            burst(ball.x, top, ball.z, 0xe84f4f, 14, 6);
            sfx.die(); shake = 0.6;
            break;
          }
          ball.y = top + BALL_R;
          if (p.type === PLAT.SPRING) {
            ball.vy = SPRING_V;
            sfx.spring();
            burst(ball.x, top, ball.z, 0xb06df2, 12, 5);
            if (p.mesh.userData.springMesh) {
              p.mesh.userData.springMesh.scale.y = 2.2; // 스프링 늘어나는 연출
            }
            shake = 0.25;
          } else {
            ball.vy = BOUNCE_V;
            sfx.bounce();
            burst(ball.x, top, ball.z, PLAT_COLOR[p.type], 6, 3.5);
          }
          if (p.type === PLAT.CRUMBLE) { p.alive = false; p.breaking = 0.001; sfx.crumble(); }
          squash = 1;
          break;
        }
      }
    }

    // 높이 갱신 / 발판 생성
    if (ball.y > maxY) { maxY = ball.y; updateHUD(); }
    while (nextSpawnY < camY + 50) { spawnLevel(nextSpawnY); nextSpawnY += difficulty(nextSpawnY).gap; }

    // 추락 사망
    if (ball.y < camY - 15) {
      dead = true; deadTimer = 0;
      sfx.die(); shake = 0.5;
    }
  }

  if (dead) {
    deadTimer += dt;
    // 죽은 뒤 잠깐 물리 유지 (가시 사망 연출)
    ball.vy -= GRAV * dt;
    ball.y += ball.vy * dt;
    ball.x += ball.vx * dt; ball.z += ball.vz * dt;
    if (deadTimer > 0.9 && state === 'playing') gameOver();
  }

  // 카메라 상승
  const targetCamY = Math.max(camY, maxY);
  camY += (targetCamY - camY) * Math.min(1, 6 * dt);

  // 발판 애니메이션 / 정리
  for (let i = platforms.length - 1; i >= 0; i--) {
    const p = platforms[i];
    if (p.type === PLAT.MOVING && p.alive) {
      p.phase += dt * p.moveSpd * 0.55;
      const off = Math.sin(p.phase) * 3;
      if (p.moveAxis === 'x') p.x = THREE.MathUtils.clamp(p.baseX + off, -AREA + 1.5, AREA - 1.5);
      else p.z = THREE.MathUtils.clamp(p.baseZ + off, -AREA + 1.5, AREA - 1.5);
      p.mesh.position.x = p.x; p.mesh.position.z = p.z;
    }
    if (p.breaking > 0) {
      p.breaking += dt;
      p.mesh.position.y = p.y - p.breaking * p.breaking * 18;
      p.mesh.rotation.x += dt * 3; p.mesh.rotation.z += dt * 2;
      const s = Math.max(0.01, 1 - p.breaking * 1.2);
      p.mesh.scale.setScalar(s);
      if (p.breaking > 0.9) { scene.remove(p.mesh); platforms.splice(i, 1); continue; }
    }
    if (p.mesh.userData.springMesh) {
      const sm = p.mesh.userData.springMesh;
      sm.scale.y += (1 - sm.scale.y) * Math.min(1, 10 * dt);
    }
    if (p.y < camY - 20) { scene.remove(p.mesh); platforms.splice(i, 1); }
  }

  // 파티클
  for (let i = particles.length - 1; i >= 0; i--) {
    const m = particles[i];
    m.userData.life -= dt;
    m.userData.v.y -= 12 * dt;
    m.position.addScaledVector(m.userData.v, dt);
    m.material.opacity = Math.max(0, m.userData.life / 0.6);
    if (m.userData.life <= 0) { scene.remove(m); m.material.dispose(); particles.splice(i, 1); }
  }

  // 공 표시
  ballGroup.position.set(ball ? ball.x : 0, ball ? ball.y : 1, ball ? ball.z : 0);
  if (ball) {
    ball.spin += (Math.abs(ball.vx) + Math.abs(ball.vz)) * dt * 0.6 + dt * 2;
    ballMesh.rotation.z = -ball.vx * 0.04;
    ballMesh.rotation.x = ball.vz * 0.04;
    stripe.rotation.z = ball.spin;
    // 스쿼시 (바운스 시 눌림)
    squash = Math.max(0, squash - dt * 5);
    const sq = 1 - squash * 0.35;
    ballMesh.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));

    // 그림자: 공 아래 가장 가까운 발판 위
    let shY = null;
    for (const p of platforms) {
      if (!p.alive && p.type !== PLAT.SPIKE) continue;
      const top = p.y + 0.26;
      if (top <= ball.y && Math.abs(ball.x - p.x) <= p.hx && Math.abs(ball.z - p.z) <= p.hz) {
        if (shY === null || top > shY) shY = top;
      }
    }
    if (shY !== null) {
      shadowMesh.visible = true;
      shadowMesh.position.set(ball.x, shY + 0.01, ball.z);
      const d = Math.min(1, (ball.y - shY) / 8);
      shadowMesh.material.opacity = 0.32 * (1 - d * 0.8);
      shadowMesh.scale.setScalar(1 - d * 0.5);
    } else shadowMesh.visible = false;
  }

  // 하늘 색 (높이 따라 우주로)
  const t = THREE.MathUtils.clamp(camY / 260, 0, 1);
  scene.background.lerpColors(SKY_LOW, SKY_HIGH, t);
  scene.fog.color.copy(scene.background);
  starMat.opacity = Math.max(0, t - 0.35) * 1.6;
  stars.position.y = camY;

  // 구름 재배치
  for (const c of clouds) {
    if (c.position.y < camY - 25) {
      c.position.y = camY + 30 + Math.random() * 25;
      c.position.x = (Math.random() - 0.5) * 50;
    }
    c.position.x += dt * 0.4;
    if (c.position.x > 30) c.position.x = -30;
    c.visible = t < 0.85; // 우주에선 구름 숨김
  }

  // 카메라
  shake = Math.max(0, shake - dt * 2);
  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  const bx = ball ? ball.x : 0, bz = ball ? ball.z : 0;
  camera.position.set(bx * 0.35 + sx, camY + 6 + sy, bz * 0.35 + 14);
  camera.lookAt(bx * 0.5, camY + 1.2, bz * 0.5);

  renderer.render(scene, camera);
}

// 메뉴 배경용 초기 씬
resetGame();
state = 'menu';
showMenu();
schedule(tick);
</script>
</body>
</html>
