<script type="module">
import * as THREE from './three.module.js';

// ?headless=1 : 화면 비표시 환경(자동 테스트)용 루프 스위치
const HEADLESS = new URLSearchParams(location.search).has('headless');
const schedule = HEADLESS ? (cb => setTimeout(() => cb(performance.now()), 16)) : (cb => requestAnimationFrame(cb));

// ───────────────────────── 상수 ─────────────────────────
const R = 0.3;                 // 공 반지름
const GRAV = 22;
const BOUNCE_V = Math.sqrt(2 * GRAV * 2.0);   // 바운스 정점 2.0
const SPRING_V = Math.sqrt(2 * GRAV * 5.0);   // 스프링 정점 5.0
const SPEED = 3.8;
const H1 = 0.7, H2 = 1.4, H3 = 2.4, H4 = 3.6;  // H3: 점프 필요, H4: 절대 못 넘는 벽 (2단 위에서도 불가)
// ─── 노란 아이템 (원작 우선순위: 대시 > 점프 > 근거리 워프 > 체크포인트) ───
const ITEM_ORDER = ['dash', 'jump', 'warp', 'cp'];
const ITEM_DEF = {
  dash: { color: 0x4fc3f7, name: '대시' },
  jump: { color: 0x3d6cf2, name: '점프' },   // 파랑 (점프로 넘는 벽과 같은 색)
  warp: { color: 0xb06df2, name: '워프' },
  cp:   { color: 0xffa040, name: '체크포인트' },
};
const DASH_SPD = 13, DASH_T = 0.3;
const JUMP_V = Math.sqrt(2 * GRAV * 2.5);   // 점프 정점 2.5 (점프 벽 2.4를 턱걸이로)
const WARP_D = 2.2;
const BALL_RED = 0xff4433;
const LS_UNLOCK = 'bb3d-unlocked';
const LS_SND = 'bb3d-snd';
// +Y축 기준 회전: (x,z) → (x·cos+z·sin, -x·sin+z·cos)
const rotY = (x, z, a) => [x * Math.cos(a) + z * Math.sin(a), -x * Math.sin(a) + z * Math.cos(a)];
let camYawTarget = -Math.PI / 2;   // 기본: 오른쪽 90° (세로 진행 시점)
let camYaw = camYawTarget;         // 실제 표시각 (부드럽게 따라감)
let camZoom = 1;                   // 휠 줌 (0.6~1.7)
let overview = false;              // 누르는 동안 전체 보기 (Shift / 🗺️ 홀드)
let stageCenter = { x: 0, z: 0 }, overviewH = 20;
function rotateCam(sign) { camYawTarget += sign * Math.PI / 2; sfx.ui(); }

// ───────────────────────── 스테이지 ─────────────────────────
// '.'허공  '#'블록  '1''2''3'단  B:1회용  P:스프링  M/N:이동(x/z)
// X:가시  *:블록+별  A:높은단+별  S:시작  E:출구  J/D/W/C:아이템
const HAND = [
  { name: '첫 만남', theme: 0, map: [
    "####*####",
    "#S..*..E#",
    "####*####",
  ]},
  { name: '징검다리', theme: 0, map: [
    "#*#..###..#*#",
    "#S#..#*#..#E#",
    "###..###..###",
  ]},
  { name: '가시 조심', theme: 0, map: [
    "#########",
    "#S.X.X.*#",
    "#..X.X.*#",
    "#*.X.X.E#",
    "#########",
  ]},
  { name: '부서지는 다리', theme: 0, map: [
    "#*#.......###",
    "#S.BBBBBBB#*#",
    "###.......#E#",
  ]},
  { name: '스프링!', theme: 1, map: [
    "....222....",
    "#S*P2T2P*E#",
    "....222....",
  ]},
  { name: '움직이는 발판', theme: 1, map: [
    "###...###...#*#",
    "#S*.N.#*#.N.#E#",
    "###...###...###",
  ]},
  { name: '담장 넘기', theme: 1, map: [
    "4444444444444",
    "4S##4##*4###4",
    "4###2###2##E4",
    "4#*#4###4#*#4",
    "4444444444444",
  ]},
  // ─── 스킬 튜토리얼 (J:점프 D:대시 W:워프 C:귀환 마커) ───
  { name: '점프 훈련', theme: 0, map: [
    "......3333....",
    "#S##J#3*J3##E#",
    "......3333....",
  ]},
  { name: '대시 협곡', theme: 0, map: [
    "###.....#*#.....#*#",
    "#SD.....#D#.....#E#",
    "###.....###.....###",
  ]},
  { name: '마지막 관문', theme: 0, map: [
    "X#X#X#X#X3#*#X#",
    "#SC*#B#W#3#*#E#",
    "#X#X#X#X#3X#X#X",
  ]},
];

// ───────── 월드 구성: 월드1 = 튜토리얼(수제 10), 월드2 = 모험(생성 20, 전 기믹 혼합) ─────────
// 향후 확장: 월드2를 50개까지 늘리거나 월드3+ 추가 (난이도 곡선에 여유 있음)

// ───────── 시드 고정 절차 생성 (스테이지 14~100) ─────────
// 안전 경로를 먼저 만들고 장애물을 얹는 방식 → 클리어 가능성 보장
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// 실측 이동 스펙 기반 도달 가능성 검사 (평지 점프 3칸=중심거리 4, +1단은 3, +2단은 2)
function mapSolvable(map) {
  const Hh = { '1': 0.7, '2': 1.4, A: 1.4, '3': 2.4, '4': 3.6, T: 3.6 };
  const nodes = []; let s = -1, e = -1; const starsI = [];
  const hasD = map.some(r => r.includes('D')), hasJ = map.some(r => r.includes('J'));
  for (let r = 0; r < map.length; r++) for (let c = 0; c < map[r].length; c++) {
    const ch = map[r][c];
    if (ch === '.' || ch === 'X') continue;
    const n = { r, c, h: Hh[ch] || 0, p: ch === 'P' };
    if (ch === 'S') s = nodes.length;
    if (ch === 'E') e = nodes.length;
    if (ch === '*' || ch === 'A' || ch === 'T' || ch === 'V') starsI.push(nodes.length);
    nodes.push(n);
  }
  if (s < 0 || e < 0) return false;
  const adj = nodes.map(() => []);
  for (let i = 0; i < nodes.length; i++) for (let j = 0; j < nodes.length; j++) {
    if (i === j) continue;
    const a = nodes[i], b = nodes[j];
    const hd = Math.hypot(a.r - b.r, a.c - b.c), rise = b.h - a.h;
    let reach = 0;
    if (rise < -0.05) reach = 4.2;                       // 낙하
    else if (rise <= 0.05) reach = hasD ? 7.0 : 4.0;     // 평지 (대시 보유 시 실측 7칸)
    else if (rise <= 0.75) reach = 3.0;                  // +1단
    else if (rise <= 1.45) reach = 2.0;                  // +2단
    else if (a.p && rise <= 4.9) reach = 2.5;            // 스프링에서 도약
    else if (hasJ && rise <= 2.45) reach = 2.0;          // 점프 아이템 (정점 2.5, 벽 위 착지 후 통과)
    if (hd <= reach) adj[i].push(j);
  }
  const seen = new Set([s]); const q = [s];
  while (q.length) { const x = q.pop(); for (const y of adj[x]) if (!seen.has(y)) { seen.add(y); q.push(y); } }
  return seen.has(e) && starsI.every(x => seen.has(x));
}

function genStage(idx) {
  // 기믹 부족·종류 단조·너무 작음·도달 불가 맵은 시드를 바꿔 재생성
  const dd = Math.min(1, (idx - 10) / 40);
  const minHz = 6 + Math.floor(dd * 7);
  const minWalk = 14 + Math.floor(dd * 12);             // 최소 보행 칸 수 (미니 맵 방지)
  const minKinds = dd < 0.15 ? 2 : (dd > 0.6 ? 4 : 3);  // 맵당 기믹 종류 최소치 (혼합 강제)
  const kindsOf = m => ['X', 'B', '2', '1', '4', 'D', 'J', 'W', 'C', 'V']
    .filter(k => m.includes(k)).length + (/[MN]/.test(m) ? 1 : 0) + (/[PT]/.test(m) ? 1 : 0);
  let st = null, best = null, bestScore = -1;
  for (let salt = 0; salt < 45; salt++) {
    st = genStageTry(idx, salt);
    const joined = st.map.join('');
    const hz = (joined.match(/[XBPMN234JDW]/g) || []).length;
    const walk = (joined.match(/[#*SECB123APTMNJDW]/g) || []).length;
    const kinds = kindsOf(joined);
    const ok = mapSolvable(st.map);
    if (ok && hz >= minHz && walk >= minWalk && kinds >= minKinds) return st;
    const score = walk + kinds * 10;
    if (ok && score > bestScore) { best = st; bestScore = score; }  // 차선: 도달 가능 중 크고 다양한 맵
  }
  return best || st;
}

function genStageTry(idx, salt) {
  const rng = mulberry32(1000 + idx * 7919 + salt * 104729);
  const d = Math.min(1, (idx - 10) / 40);              // 난이도 램프 (20개 기준 0~0.5, 확장 여지)
  const steps = 12 + Math.floor(d * 16) + Math.floor(rng() * 3);  // 경로 마디 수
  // 맵 경계 (랜덤 워크 범위) — 접힘 분리를 위해 넉넉하게
  const rB = 4 + Math.floor(d * 4) + Math.floor(rng() * 2);
  const cB = 11 + Math.floor(d * 9) + Math.floor(rng() * 3);
  const K = (r, c) => r + ',' + c;
  const grid = new Map(), occupied = new Set(), nodeco = new Set();
  const pathCells = [];                                // 경로가 지나간 모든 칸 (분리 검사용)
  const put = (r, c, ch) => { grid.set(K(r, c), ch); occupied.add(K(r, c)); pathCells.push([r, c]); };
  const at = (r, c) => grid.get(K(r, c)) || '.';
  const banDeco = (r, c) => { for (const [a, b] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) nodeco.add(K(r + a, c + b)); };
  const inB = (r, c) => Math.abs(r) <= rB && c >= 0 && c <= cB;
  // 3D 지름길 방지: 새 칸은 "최근 5칸 이전의 경로"와 4.6칸 이상 떨어져야 함
  // (평지 점프 사거리 4칸 + 여유 → 접힌 경로 사이를 건너뛸 수 없음)
  const SEP = 4.6;
  const farEnough = (r, c) => {
    for (let i = 0; i < pathCells.length - 5; i++) {
      const p = pathCells[i];
      if (Math.hypot(p[0] - r, p[1] - c) < SEP) return false;
    }
    return true;
  };
  const free = (r, c) => inB(r, c) && !occupied.has(K(r, c)) && farEnough(r, c);

  let pr = 0, pc = 0, dr = 0, dc = 1;                  // 시작: 동쪽으로
  const anchors = [];
  const step = () => { pr += dr; pc += dc; };
  const aheadFree = n => { for (let i = 1; i <= n; i++) if (!free(pr + dr * i, pc + dc * i)) return false; return true; };
  const flat = () => { put(pr, pc, LEVCH[lev]); anchors.push([pr, pc, lev]); straightRun++; step(); };
  // 장애물: 현재 진행 방향으로 배치. [필요 칸수, 실행 함수] 쌍
  let straightRun = 0;                                 // 같은 방향 연속 평지 수 (조주로)
  let lev = 0;                                         // 경로 고도 (0=바닥, 1=1단 능선, 2=2단 능선)
  const LEVCH = ['#', '1', '2'];
  const markVoid = () => { occupied.add(K(pr, pc)); pathCells.push([pr, pc]); banDeco(pr, pc); };
  // 3칸 공백은 조주로(직선 2칸+) 있어야 실전에서 가능 — 없으면 2칸으로 축소
  const gapN = n => [n + 1, () => { const nn = n >= 3 && straightRun < 2 ? 2 : n; for (let i = 0; i < nn; i++) { markVoid(); step(); } flat(); }];
  const spikeN = n => [n + 1, () => { const nn = n >= 3 && straightRun < 2 ? 2 : n; for (let i = 0; i < nn; i++) { put(pr, pc, 'X'); banDeco(pr, pc); step(); } flat(); }];
  // 1회용 징검다리: B돌을 2칸 간격으로 띄움 — 돌 사이가 일반 점프 최대치(2칸 공백)
  // 전체 폭 8칸+ → 대시로도 못 건너뜀. 반드시 밟아야 하고, 밟으면 부서져 되돌아올 수 없음
  // 마스 월드(w4)부터는 돌 사이가 허공 대신 가시밭 — 짧게 뛰면 즉사 (긴장 고조)
  const crumbleN = n => [3 * n - 1, () => {
    const spiked = d >= 0.35;
    for (let i = 0; i < n; i++) {
      put(pr, pc, 'B'); banDeco(pr, pc); step();
      if (i < n - 1) for (let k = 0; k < 2; k++) {
        if (spiked) { put(pr, pc, 'X'); banDeco(pr, pc); } else markVoid();
        step();
      }
    }
    flat();
  }];
  const nearWall3 = (r, c) => {
    for (const [k2, ch2] of grid) {
      if (ch2 !== '3' && ch2 !== '4') continue;   // 점프 벽·회오리 벽 모두
      const [er, ec] = k2.split(',').map(Number);
      if (Math.hypot(er - r, ec - c) < 4.5) return true;
    }
    return false;
  };
  const wall2M = () => [2, () => {
    if (nearWall3(pr, pc)) { flat(); return; }         // 점프 벽 옆 단차 금지 (벽 무력화 방지)
    put(pr, pc, '2'); banDeco(pr, pc); step(); flat();
  }];
  // 고도 상승: 이후 경로가 1단/2단 능선으로 이어짐 (내려올 땐 그냥 떨어짐)
  const upM = () => [1, () => {
    if (lev >= 2 || nearWall3(pr, pc)) { flat(); return; }
    lev++;
    flat();
  }];
  // 이동 발판 = 페리: 점프(4칸)로 못 넘는 5칸 공백(후반 7칸) 한가운데서 크게 왕복
  const moverM = () => {
    const g = d >= 0.7 ? 7 : 5;
    return [g + 2, () => {
      const mid = Math.floor(g / 2);
      for (let i = 0; i < g; i++) {
        if (i === mid) { put(pr, pc, dc !== 0 ? 'M' : 'N'); banDeco(pr, pc); }  // 이동축 = 진행축
        else markVoid();
        step();
      }
      flat();
    }];
  };
  const springM = () => [3, () => {
    if (nearWall3(pr, pc) || nearWall3(pr + dr, pc + dc)) { flat(); return; }  // 벽 옆 스프링 금지 (벽 무력화 방지)
    put(pr, pc, 'P'); banDeco(pr, pc); step(); put(pr, pc, 'T'); banDeco(pr, pc); step(); flat();
  }];
  const barrier = ch => [4, () => {
    // 벽 반경 4.5칸 안에 단차 블록(1·2단·A·스프링·다른 벽)이 있으면
    // 그 위에서 뛰어 아이템 없이 넘을 수 있으므로 벽 배치 포기 → 평지로 대체
    const wr = pr + dr, wc = pc + dc;
    for (const [k2, ch2] of grid) {
      if (!'123APT'.includes(ch2)) continue;
      const [er, ec] = k2.split(',').map(Number);
      if (Math.hypot(er - wr, ec - wc) < 4.5) { flat(); return; }
    }
    put(pr, pc, ch); banDeco(pr, pc); step();          // 아이템 (J/W)
    put(pr, pc, '3');                                  // 벽 본체 + 양옆 3칸 두께
    // 벽 주변 5×3 구역 장식 전면 금지 → 우회 발판 원천 차단
    for (let a = -2; a <= 2; a++) for (let b = -1; b <= 1; b++)
      nodeco.add(K(pr + dc * a + dr * b, pc + dr * a + dc * b));
    for (const s of [1, -1]) {
      const br = pr + dc * s, bc = pc + dr * s;        // 진행 방향의 수직
      if (free(br, bc)) put(br, bc, '3');
    }
    step(); flat(); flat();
  }];
  // 대시 협곡: 실측 대시 사거리 7칸 기준 — 기본 5칸, 카오스·마스터는 6칸(정밀 대시)
  const dashGap = d >= 0.7 ? 6 : 5;
  const dashM = () => [dashGap + 3, () => {
    put(pr, pc, 'D'); banDeco(pr, pc); step();
    for (let i = 0; i < dashGap; i++) { markVoid(); step(); }
    flat(); flat();
  }];
  // 회오리턴: 경로 위 못 넘는 벽(4단) + 양옆·아래 허공 → 공중에서 옆으로 감아 돌아 통과 (3D 전용 장애물)
  // len 1 = 감아돌기 약 3.1칸(수월), len 2 = 약 3.6칸(점프 한계 근접)
  const swirl = len => [len + 2, () => {
    for (let i = 0; i < len; i++) for (const s of [1, -1]) {
      if (!free(pr + dr * i + dc * s, pc + dc * i + dr * s)) { flat(); return; }  // 옆이 안 비면 포기
    }
    // 스프링·탑이 근처에 있으면 벽 위로 날아 넘을 수 있으므로 포기
    for (const [k2, ch2] of grid) {
      if (ch2 !== 'P' && ch2 !== 'T') continue;
      const [er, ec] = k2.split(',').map(Number);
      if (Math.hypot(er - pr, ec - pc) < 4.5) { flat(); return; }
    }
    for (let i = 0; i < len; i++) {
      put(pr, pc, '4'); banDeco(pr, pc);
      for (const s of [1, -1]) {           // 벽 양옆은 영구 허공 (다른 경로·장식 금지)
        const br = pr + dc * s, bc = pc + dr * s;
        occupied.add(K(br, bc)); pathCells.push([br, bc]); nodeco.add(K(br, bc));
      }
      step();
    }
    flat(); flat();
  }];

  // 통합 기믹 풀: 월드 2부터 전 기믹 혼합 — 난이도(d)로 가중치·강도만 조절
  // (월드 1은 수제 튜토리얼: 블록·스킬을 하나씩 소개)
  const pool = [
    [() => gapN(1), 2],
    [() => gapN(2), 2 + d * 2],
    [() => gapN(3), d * 2.5],
    [() => spikeN(1), 2],
    [() => spikeN(2), 1 + d * 3],
    [() => spikeN(3), d * 2],
    [() => crumbleN(3), 1.5],
    [() => crumbleN(4), d * 2],
    [moverM, 1.5],
    [springM, 1.5],
    [wall2M, 1.5],
    [() => barrier('J'), 1.5],
    [() => barrier('W'), 1.2],
    [dashM, 1.5],
    [() => swirl(1), 1.5],
    [() => swirl(2), d * 2.5],
    [upM, 2],
  ];
  const pick = () => {
    let tot = 0; for (const p of pool) tot += p[1];
    let r = rng() * tot;
    for (const p of pool) { r -= p[1]; if (r <= 0) return p[0](); }
    return pool[0][0]();
  };
  const tryTurn = () => {
    // 좌/우 회전 후보 중 전진 가능한 곳으로 (경로가 굽이치게)
    const dirs = [[dc, dr], [-dc, -dr]];
    if (rng() < 0.5) dirs.reverse();
    for (const [nr, nc] of dirs) {
      const ok = (() => { for (let i = 1; i <= 3; i++) if (!free(pr + nr * i, pc + nc * i)) return false; return true; })();
      if (ok) { dr = nr; dc = nc; straightRun = 0; return true; }
    }
    return false;
  };

  // ── 경로 구축: 굽이치는 랜덤 워크 (고도 변화 포함) ──
  flat(); flat();
  for (let s = 0; s < steps; s++) {
    if (rng() < 0.45 && tryTurn()) { flat(); continue; }         // 자주 방향 전환
    if (!aheadFree(2)) { if (!tryTurn()) break; flat(); continue; }
    if (lev > 0) {
      // 능선 구간: 계속 가거나, 내려오거나, 능선 위 좁은 갭
      const r2 = rng();
      if (r2 < 0.22) { lev--; flat(); }
      else if (r2 < 0.52 && aheadFree(3)) { gapN(1)[1](); }
      else flat();
      continue;
    }
    if (rng() < 0.85 + d * 0.12) {
      const [need, run] = pick();
      if (aheadFree(need + 1)) { run(); continue; }
      // 큰 장애물이 안 들어가면 작은 장애물로 대체 (밋밋함 방지)
      const [n2, r2] = rng() < 0.5 ? gapN(1) : spikeN(1);
      if (aheadFree(n2 + 1)) { r2(); continue; }
    }
    flat();
  }
  while (lev > 0 && free(pr, pc)) { lev--; flat(); }   // 능선에서 내려와 마무리
  if (!free(pr, pc)) { pr -= dr; pc -= dc; }           // 마지막 위치 보정
  const lastA = anchors[anchors.length - 1];
  put(lastA[0], lastA[1], 'E');
  anchors.pop();

  // S + 별/체크포인트 (경로 평지 위 → 지나가면 자연 수집)
  const [sr, sc] = anchors.shift();
  put(sr, sc, 'S');
  const cand = anchors.filter(a => a[2] === 0);   // 별·C는 바닥 경로에만 (능선 구멍 방지)
  for (let i = cand.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [cand[i], cand[j]] = [cand[j], cand[i]]; }
  let hasC = false;
  if (cand.length > 4 && rng() < 0.25 + d * 0.35) {
    const [cr, cc] = cand.pop();
    put(cr, cc, 'C');
    hasC = true;
  }
  const nStars = Math.max(1, Math.min(cand.length, 3 + Math.floor(rng() * 2) + (d > 0.5 ? 1 : 0)));
  for (let i = 0; i < nStars; i++) { const [cr, cc] = cand[i]; put(cr, cc, '*'); }

  // 장식: 꼭 필요한 것만. 가시(위협)는 유지, 어깨 블록은 외딴 한 칸만 소량 —
  // 이웃 통로가 생기지 않게 '붙는 블록이 정확히 1개'일 때만 허용 (우회로 차단)
  const shoulderP = d < 0.15 ? 0.12 : 0.05;
  const spikeDecoP = 0.12 + 0.28 * d;
  const walkable = '#*SECB';
  const isWalk = (r, c) => at(r, c) !== '.' && at(r, c) !== 'X';
  for (const [k, ch] of [...grid]) {
    if (!walkable.includes(ch)) continue;
    const [r, c] = k.split(',').map(Number);
    for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const rr = r + a, cc = c + b;
      if (!inB(rr, cc) || at(rr, cc) !== '.' || nodeco.has(K(rr, cc))) continue;
      const roll = rng();
      if (roll < spikeDecoP) { put(rr, cc, 'X'); continue; }
      if (roll < spikeDecoP + shoulderP) {
        let nb = 0;
        for (const [a2, b2] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (isWalk(rr + a2, cc + b2)) nb++;
        // 접힌 경로 사이 다리가 되지 않도록: 주변 2칸 밖 경로와 4.2칸 이상 떨어질 때만
        const bridgeSafe = pathCells.every(p => {
          const dd = Math.hypot(p[0] - rr, p[1] - cc);
          return dd < 2.0 || dd >= 4.2;
        });
        if (nb === 1 && bridgeSafe) put(rr, cc, '#');
      }
    }
  }

  // 허공 별: C(귀환 스킬)가 있는 스테이지에만 — 사방이 허공인 곳에 별을 띄움
  // (뛰어내려 공중에서 먹고, 떨어져 죽기 전에 귀환해야 함)
  if (hasC) {
    for (let tries = 0; tries < 40; tries++) {
      const [ar, ac] = cand[Math.floor(rng() * cand.length)] || [];
      if (ar === undefined) break;
      const [a, b] = [[1, 0], [-1, 0], [0, 1], [0, -1]][Math.floor(rng() * 4)];
      const vr = ar + a * 3, vc = ac + b * 3;   // 3칸 밖 허공 (컷백 점프 수집 불가)
      if (at(ar + a, ac + b) !== '.' || at(ar + a * 2, ac + b * 2) !== '.' || at(vr, vc) !== '.') continue;
      // 반경 2.9 내 발판 전무 → 나가면 편도, 귀환 스킬 없이는 회수 불가
      let isolated = true;
      for (const [k2, ch2] of grid) {
        if (ch2 === '.' || ch2 === 'X') continue;
        const [er, ec] = k2.split(',').map(Number);
        if (Math.hypot(er - vr, ec - vc) < 2.9) { isolated = false; break; }
      }
      if (!isolated) continue;
      grid.set(K(vr, vc), 'V');
      banDeco(vr, vc);
      break;
    }
  }

  // 좌표 정규화 → 문자열 행렬
  let rMin = 99, rMax = -99, cMin = 99, cMax = -99;
  for (const k of grid.keys()) {
    const [r, c] = k.split(',').map(Number);
    rMin = Math.min(rMin, r); rMax = Math.max(rMax, r);
    cMin = Math.min(cMin, c); cMax = Math.max(cMax, c);
  }
  const lines = [];
  for (let r = rMin; r <= rMax; r++) {
    let s = '';
    for (let c = cMin; c <= cMax; c++) s += at(r, c);
    lines.push(s);
  }
  // 배경 테마는 4스테이지마다 순환 (하늘→노을→밤→우주→…)
  return { name: `모험 ${idx - 9}`, theme: 1 + Math.floor((idx - 10) / 4) % 9, map: lines };
}

  star:   new THREE.MeshStandardMaterial({ color: 0xffd233, roughness: 0.3, emissive: 0x996b00 }),
  pad:    new THREE.MeshStandardMaterial({ color: 0xcfa3ff, roughness: 0.4 }),
};
const boxGeo = new THREE.BoxGeometry(0.97, 0.5, 0.97);
const box1Geo = new THREE.BoxGeometry(0.97, 0.5 + H1, 0.97);
const box2Geo = new THREE.BoxGeometry(0.97, 0.5 + H2, 0.97);
const box3Geo = new THREE.BoxGeometry(0.97, 0.5 + H3, 0.97);
const box4Geo = new THREE.BoxGeometry(0.97, 0.5 + H4, 0.97);
MAT.step3 = new THREE.MeshStandardMaterial({ color: 0x4668d9, roughness: 0.6 });  // 점프 벽 = 파랑 (점프 스킬 색)
MAT.step4 = new THREE.MeshStandardMaterial({ color: 0x5b6272, roughness: 0.7 });  // 회색 벽 = 절대 못 넘음
const itemRingGeo = new THREE.TorusGeometry(0.26, 0.05, 8, 20);
const itemCoreGeo = new THREE.SphereGeometry(0.14, 12, 10);
const itemRingMat = new THREE.MeshStandardMaterial({ color: 0xffd233, roughness: 0.35, emissive: 0x7a5500 });
const spikeGeo = new THREE.ConeGeometry(0.14, 0.4, 6);
const starGeo = new THREE.OctahedronGeometry(0.24);
const padGeo = new THREE.CylinderGeometry(0.32, 0.38, 0.16, 14);
const ringGeo = new THREE.TorusGeometry(0.36, 0.05, 8, 24);

// ───────────────────────── 사운드 ─────────────────────────
let sndOn = localStorage.getItem(LS_SND) !== '0';
let actx = null;
function beep(freq, dur, type = 'sine', vol = 0.14, slide = 0, delay = 0) {
  if (!sndOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}
const sfx = {
  bounce: () => beep(300 + Math.random() * 40, 0.08, 'sine', 0.1, 120),
  star:   () => { beep(660, 0.1, 'sine', 0.12); beep(990, 0.15, 'sine', 0.12, 0, 0.08); },
  spring: () => beep(380, 0.25, 'square', 0.07, 520),
  brk:    () => beep(190, 0.12, 'triangle', 0.12, -70),
  die:    () => beep(280, 0.55, 'sawtooth', 0.12, -230),
  clear:  () => { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.16, 'sine', 0.13, 0, i * 0.11)); },
  open:   () => { beep(440, 0.12, 'sine', 0.1); beep(587, 0.18, 'sine', 0.1, 0, 0.1); },
  ui:     () => beep(600, 0.06, 'sine', 0.1),
};
const sndBtn = document.getElementById('sndBtn');
function updSndBtn() { sndBtn.textContent = sndOn ? '🔊' : '🔇'; }
sndBtn.addEventListener('click', () => {
  sndOn = !sndOn; localStorage.setItem(LS_SND, sndOn ? '1' : '0'); updSndBtn(); sfx.ui();
});
updSndBtn();

// ───────────────────────── 파티클 ─────────────────────────
const particles = [];
const partGeo = new THREE.SphereGeometry(0.06, 6, 5);
function burst(x, y, z, color, n = 8, spd = 3) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(partGeo, new THREE.MeshBasicMaterial({ color, transparent: true }));
    m.position.set(x, y, z);
    const a = Math.random() * Math.PI * 2;
    m.userData.v = new THREE.Vector3(Math.cos(a) * spd * Math.random(), 1.5 + Math.random() * 2.5, Math.sin(a) * spd * Math.random());
    m.userData.life = 0.55;
    scene.add(m); particles.push(m);
  }
}

// ───────────────────────── 스테이지 로드 ─────────────────────────
let blocks = [];        // {gx,gz,wx,wz,top,type,mesh,alive,breaking, star?, mover?, axis, base, phase}
let stars = [];         // {mesh, block, got}
let items = [];         // {mesh, core, block, itype, got}
let inv = {};           // 보유 아이템 {itype: true}
let checkpoint = null;  // {x, z}
let lastTint = null;    // 마지막으로 먹은 아이템 상징색
let lastDir = [1, 0];   // 마지막 이동 방향 (대시/워프용, 기본: 전진)
let exitObj = null;     // {block, pad, ring, open}
let startPos = { x: 0, z: 0 };
let stageIdx = 0, starsGot = 0, starsTotal = 0;
let stageRoot = new THREE.Group();
scene.add(stageRoot);

function clearStage() {
  scene.remove(stageRoot);
  stageRoot = new THREE.Group();
  scene.add(stageRoot);
  blocks = []; stars = []; items = []; exitObj = null;
  inv = {}; checkpoint = null;
  cpMesh.visible = false;
  updateInvUI();
  for (const m of particles) scene.remove(m);
  particles.length = 0;
}

function loadStage(idx) {
  clearStage();
  stageIdx = idx;
  starsGot = 0;
  const st = STAGES[idx];
  const rows = st.map.length, cols = st.map[0].length;
  const ox = -(cols - 1) / 2, oz = -(rows - 1) / 2;
  starsTotal = 0;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const ch = st.map[r][c];
      if (ch === '.') continue;
      const wx = ox + c, wz = oz + r;
      if (ch === 'V') {
        // 허공 별: 바닥 없이 떠 있음 — 뛰어내려 먹고 체크포인트 귀환으로 살아나야 함
        const sm = new THREE.Mesh(starGeo, MAT.star);
        sm.position.set(wx, 0.85, wz);
        sm.scale.y = 1.35;
        stageRoot.add(sm);
        stars.push({ mesh: sm, block: { top: 0, gx: c }, got: false });
        starsTotal++;
        continue;
      }
      let type = 'block', top = 0, mat = MAT.block, geo = boxGeo;
      if (ch === '1') { type = 'step'; top = H1; mat = MAT.step1; geo = box1Geo; }
      else if (ch === '2') { type = 'step'; top = H2; mat = MAT.step2; geo = box2Geo; }
      else if (ch === 'A') { type = 'step'; top = H2; mat = MAT.step2; geo = box2Geo; }
      else if (ch === 'T') { type = 'step'; top = H4; mat = MAT.step4; geo = box4Geo; }  // 스프링 전용 탑
      else if (ch === '3') { type = 'step'; top = H3; mat = MAT.step3; geo = box3Geo; }
      else if (ch === '4') { type = 'step'; top = H4; mat = MAT.step4; geo = box4Geo; }
      else if (ch === 'B') { type = 'brk'; mat = MAT.brk; }
      else if (ch === 'P') { type = 'spring'; mat = MAT.spring; }
      else if (ch === 'M' || ch === 'N') { type = 'mover'; mat = MAT.mover; }
      else if (ch === 'X') { type = 'spike'; mat = MAT.spikeB; }
      else if (ch === 'S') { type = 'start'; mat = MAT.start; }
      else if (ch === 'E') { type = 'exit'; mat = MAT.exit; }

      const mesh = new THREE.Mesh(geo, mat);
      // 박스 중심: top - (박스높이/2)
      const bh = 0.5 + top;
      mesh.position.set(wx, top - bh / 2, wz);
      stageRoot.add(mesh);

      const b = { gx: c, gz: r, wx, wz, top, type, mesh, alive: true, breaking: 0 };

      if (type === 'spike') {
        for (let i = 0; i < 9; i++) {
          const s = new THREE.Mesh(spikeGeo, MAT.spike);
          s.position.set(((i % 3) - 1) * 0.3, bh / 2 + 0.2, (Math.floor(i / 3) - 1) * 0.3);
          mesh.add(s);
        }
      } else if (type === 'spring') {
        const pad = new THREE.Mesh(padGeo, MAT.pad);
        pad.position.y = bh / 2 + 0.08;
        mesh.add(pad);
        b.springPad = pad;
      } else if (type === 'mover') {
        b.mover = true;
        b.axis = ch === 'M' ? 'x' : 'z';
        b.base = ch === 'M' ? wx : wz;
        b.phase = (r * 7 + c) * 0.9;
        // 진폭: 축 방향 양쪽 빈 칸 수에 맞춤 (긴 공백 = 긴 왕복 페리)
        let vl = 0, vr = 0;
        const dr2 = b.axis === 'z' ? 1 : 0, dc2 = b.axis === 'x' ? 1 : 0;
        for (let k = 1; k < 9; k++) { if (((st.map[r - dr2 * k] || '')[c - dc2 * k]) === '.') vl++; else break; }
        for (let k = 1; k < 9; k++) { if (((st.map[r + dr2 * k] || '')[c + dc2 * k]) === '.') vr++; else break; }
        b.amp = Math.min(3, Math.max(1.2, Math.min(vl, vr)));
      } else if (type === 'start') {
        startPos = { x: wx, z: wz };
      } else if (type === 'exit') {
        const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.1, 20), new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.4, emissive: 0x000000 }));
        pad.position.y = bh / 2 + 0.05;
        mesh.add(pad);
        const ring = new THREE.Mesh(ringGeo, new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.4, emissive: 0x000000 }));
        ring.rotation.x = Math.PI / 2;
        ring.position.y = bh / 2 + 0.12;
        mesh.add(ring);
        exitObj = { block: b, pad, ring, open: false };
      }

      if (ch === '*' || ch === 'A' || ch === 'T') {
        const sm = new THREE.Mesh(starGeo, MAT.star);
        sm.position.set(wx, top + 0.85, wz);
        sm.scale.y = 1.35;
        stageRoot.add(sm);
        stars.push({ mesh: sm, block: b, got: false });
        starsTotal++;
      }
      const ITEM_CH = { J: 'jump', D: 'dash', W: 'warp', C: 'cp' };
      if (ITEM_CH[ch]) {
        const itype = ITEM_CH[ch];
        const g = new THREE.Group();
        const ring = new THREE.Mesh(itemRingGeo, itemRingMat);
        const core = new THREE.Mesh(itemCoreGeo,
          new THREE.MeshStandardMaterial({ color: ITEM_DEF[itype].color, roughness: 0.3, emissive: ITEM_DEF[itype].color, emissiveIntensity: 0.35 }));
        g.add(ring, core);
        g.position.set(wx, top + 0.85, wz);
        stageRoot.add(g);
        items.push({ mesh: g, block: b, itype, got: false });
      }
      blocks.push(b);
    }
  }

  // 전체 보기용 스테이지 중심/높이 계산
  let mnx = 1e9, mxx = -1e9, mnz = 1e9, mxz = -1e9;
  for (const b of blocks) {
    mnx = Math.min(mnx, b.wx); mxx = Math.max(mxx, b.wx);
    mnz = Math.min(mnz, b.wz); mxz = Math.max(mxz, b.wz);
  }
  stageCenter = { x: (mnx + mxx) / 2, z: (mnz + mxz) / 2 };
  overviewH = Math.max(mxx - mnx, mxz - mnz) * 0.95 + 8;

  // 테마 적용
  const th = THEMES[st.theme];
  scene.background.set(th.bg);
  scene.fog.color.set(th.bg);
  hemi.intensity = th.hemi;
  sun.intensity = th.sun;
  cloudFloor.material.opacity = st.theme === 2 ? 0.08 : 0.25;

  resetBall();
  updateHUD();
}

function resetBall(pos) {
  const p = pos || startPos;
  ball = { x: p.x, y: 1.6, z: p.z, vx: 0, vy: 0, vz: 0, spin: 0, dashT: 0, dashX: 1, dashZ: 0 };
  dead = false; deadTimer = 0; squash = 0; shake = 0;
  const held = ITEM_ORDER.some(k => inv[k]);
  ballMat.color.set(held && lastTint ? lastTint : BALL_RED);
  ballMesh.visible = true;
}

function restorePieces(full) {
  if (full) {
    starsGot = 0;
    for (const s of stars) { s.got = false; s.mesh.visible = true; }
  }
  // 아이템: 보유 중이 아니면 다시 등장 (같은 종류는 한 번만 보유)
  for (const it of items) {
    if (full || !inv[it.itype]) { it.got = false; it.mesh.visible = true; }
  }
  for (const b of blocks) {
    if (b.type === 'brk') {
      b.alive = true; b.breaking = 0;
      b.mesh.visible = true;
      b.mesh.position.set(b.wx, -0.25, b.wz);
      b.mesh.rotation.set(0, 0, 0);
      b.mesh.scale.setScalar(1);
    }
  }
  if (exitObj) setExit(!full && starsTotal > 0 && starsGot === starsTotal);
}

function resetStage() {           // 전체 리셋 (R키·재시작 버튼·스테이지 시작)
  stageTime = 0;
  moverT = 0;                     // 이동 블록도 초기 위치부터 (매 시도 일관성)
  checkpoint = null; cpMesh.visible = false;
  inv = {}; lastTint = null; updateInvUI();
  restorePieces(true);
  resetBall();
  updateHUD();
}

// 죽으면 무조건 처음부터 (원작 방식 — 체크포인트는 부활이 아니라 '귀환 스킬')

// ─── 아이템 사용 (우선순위: 대시 > 점프 > 워프 > 체크포인트) ───
function useItem() {
  if (state !== 'playing' || !ball || dead) return;
  const t = ITEM_ORDER.find(k => inv[k]);
  if (!t) return;
  const def = ITEM_DEF[t];
  if (t === 'cp') {
    if (!checkpoint) {
      // 1단계: 마커 설치 (아이템은 유지 — 귀환할 때 소비)
      let best = null, bd = 0.8;
      for (const b of blocks) {
        if (!b.alive || b.type === 'spike') continue;
        const d = Math.hypot(ball.x - b.wx, ball.z - b.wz);
        if (d < bd) { bd = d; best = b; }
      }
      if (!best) { showHint('발판 근처에서만 설치할 수 있어요!'); return; }
      checkpoint = { x: best.wx, z: best.wz };
      cpMesh.position.set(best.wx, best.top, best.wz);
      cpMesh.visible = true;
      sfx.open();
      burst(best.wx, best.top + 0.5, best.wz, def.color, 10, 3);
      showHint('마커 설치! 한 번 더 쓰면 귀환 (죽기 전에!)');
      return;                                          // 소비하지 않음
    }
    // 2단계: 마커로 귀환 (일회성 — 소비)
    burst(ball.x, ball.y, ball.z, def.color, 8, 3);
    ball.x = checkpoint.x; ball.z = checkpoint.z;
    ball.y = 1.6; ball.vx = 0; ball.vy = 0; ball.vz = 0;
    checkpoint = null; cpMesh.visible = false;
    sfx.open();
    burst(ball.x, ball.y, ball.z, def.color, 10, 3);
  } else if (t === 'dash') {
    ball.dashT = DASH_T; ball.dashX = lastDir[0]; ball.dashZ = lastDir[1];
    sfx.spring(); shake = 0.15;
    burst(ball.x, ball.y, ball.z, def.color, 10, 4);
  } else if (t === 'jump') {
    ball.vy = JUMP_V; squash = 0.7;
    sfx.spring();
    burst(ball.x, ball.y - R, ball.z, def.color, 10, 4);
  } else if (t === 'warp') {
    burst(ball.x, ball.y, ball.z, def.color, 8, 3);
    ball.x += lastDir[0] * WARP_D;
    ball.z += lastDir[1] * WARP_D;
    sfx.open();
    burst(ball.x, ball.y, ball.z, def.color, 8, 3);
  }
  delete inv[t];
  // 사용 후에도 마지막으로 먹은 색 유지, 다 떨어지면 원래 색
  if (!ITEM_ORDER.some(k => inv[k])) ballMat.color.set(BALL_RED);
  updateInvUI();
}

function updateInvUI() {
  const held = ITEM_ORDER.filter(k => inv[k]);
  const bar = $('invBar');
  bar.innerHTML = held.map((k, i) =>
    `<span class="invDot${i === 0 ? ' first' : ''}" style="background:#${ITEM_DEF[k].color.toString(16).padStart(6, '0')}">${ITEM_DEF[k].name}</span>`
  ).join('');
  $('useBtn').style.display = held.length && state === 'playing' ? 'flex' : 'none';
}

function setExit(open) {
  exitObj.open = open;
  exitObj.pad.material.color.set(open ? 0x35d977 : 0x555555);
  exitObj.pad.material.emissive.set(open ? 0x0a5c2c : 0x000000);
  exitObj.ring.material.color.set(open ? 0x7bffb2 : 0x888888);
  exitObj.ring.material.emissive.set(open ? 0x1c7a44 : 0x000000);
}

// ───────────────────────── 입력 ─────────────────────────
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (state === 'playing') {
    if (e.code === 'KeyP') pauseGame();
    else if (e.code === 'KeyR') { sfx.ui(); resetStage(); }
    else if (e.code === 'Space') { e.preventDefault(); useItem(); }
    else if (e.code === 'ArrowLeft') { e.preventDefault(); if (!e.repeat) rotateCam(1); }    // 화면 회전
    else if (e.code === 'ArrowRight') { e.preventDefault(); if (!e.repeat) rotateCam(-1); }
    else if (e.code === 'ArrowUp') { e.preventDefault(); camZoom = Math.max(0.6, camZoom - 0.12); }  // 줌
    else if (e.code === 'ArrowDown') { e.preventDefault(); camZoom = Math.min(1.7, camZoom + 0.12); }
    else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') overview = true;   // 홀드: 전체 보기
  } else if (state === 'paused' && e.code === 'KeyP') resumeGame();
});
addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') overview = false;
});

const joyBase = document.getElementById('joyBase');
const joyNub = document.getElementById('joyNub');
let joy = null;
function joyNubTo(x, y) { joyNub.style.left = (x - 21) + 'px'; joyNub.style.top = (y - 21) + 'px'; }
canvas.addEventListener('pointerdown', e => {
  if (state !== 'playing') return;
  joy = { id: e.pointerId, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0 };
  joyBase.style.display = joyNub.style.display = 'block';
  joyBase.style.left = (e.clientX - 48) + 'px'; joyBase.style.top = (e.clientY - 48) + 'px';
  joyNubTo(e.clientX, e.clientY);
});
addEventListener('pointermove', e => {
  if (!joy || e.pointerId !== joy.id) return;
  const Rj = 55;
  let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy;
  const len = Math.hypot(dx, dy);
  if (len > Rj) { dx = dx / len * Rj; dy = dy / len * Rj; }
  joy.dx = dx / Rj; joy.dy = dy / Rj;
  joyNubTo(joy.ox + dx, joy.oy + dy);
});
function joyEnd(e) { if (joy && e.pointerId === joy.id) { joy = null; joyBase.style.display = joyNub.style.display = 'none'; } }
addEventListener('pointerup', joyEnd);
addEventListener('pointercancel', joyEnd);

function inputVector() {
  let ix = 0, iz = 0;
  if (keys['KeyA']) ix -= 1;
  if (keys['KeyD']) ix += 1;
  if (keys['KeyW']) iz -= 1;
  if (keys['KeyS']) iz += 1;
  if (joy) { ix += joy.dx; iz += joy.dy; }
  let len = Math.hypot(ix, iz);
  if (len > 1) { ix /= len; iz /= len; }
  return rotY(ix, iz, camYawTarget); // 화면 기준 입력 → 월드 방향
}

let state = 'menu'; // menu | playing | paused | clear | allclear
let ball = null, dead = false, deadTimer = 0, squash = 0, shake = 0;
let unlocked = Math.min(parseInt(localStorage.getItem(LS_UNLOCK) || '1'), STAGES.length);
// 스테이지 클리어 타임 기록 (스테이지별 개인 최고 — 추후 온라인 랭킹 확장 예정)
let stageTime = 0;
let moverT = 0;   // 이동 블록 전용 시계 — 재시작 시 0으로 초기화 → 매 시도 발판 위치 동일
let bestTimes = {};
try { bestTimes = JSON.parse(localStorage.getItem('bb3d-times') || '{}'); } catch (e) {}
const fmtT = s => { const m = Math.floor(s / 60); return m + ':' + (s - m * 60).toFixed(1).padStart(4, '0'); };

const $ = id => document.getElementById(id);
const menuEl = $('menu'), clearEl = $('clear'), allclearEl = $('allclear'), pausedEl = $('paused'), hudEl = $('hud');

const WORLDS = [
  { title: '🌍 월드 1 — 기본', from: 0, to: 9 },
  { title: '🚀 월드 2 — 모험', from: 10, to: STAGES.length - 1 },
];
function buildStageGrid() {
  const g = $('stageGrid');
  g.innerHTML = '';
  for (const w of WORLDS) {
    const h = document.createElement('div');
    h.className = 'worldTitle';
    h.style.gridColumn = '1 / -1';
    h.textContent = w.title;
    g.appendChild(h);
    for (let i = w.from; i <= w.to; i++) {
      const b = document.createElement('button');
      if (i < unlocked - 1) { b.className = 'stBtn done'; b.textContent = i + 1; }
      else if (i === unlocked - 1) { b.className = 'stBtn'; b.textContent = i + 1; }
      else { b.className = 'stBtn locked'; b.textContent = '🔒'; }
      if (i < unlocked) b.addEventListener('click', () => startStage(i));
      g.appendChild(b);
    }
  }
}

function startStage(i) {
  sfx.ui();
  loadStage(i);
  state = 'playing';
  menuEl.classList.add('hidden');
  clearEl.classList.add('hidden');
  allclearEl.classList.add('hidden');
  hudEl.classList.remove('hidden');
  $('timeHud').classList.remove('hidden');
  $('keyHint').classList.remove('hidden');
}

function toMenu() {
  sfx.ui();
  state = 'menu';
  clearEl.classList.add('hidden');
  allclearEl.classList.add('hidden');
  pausedEl.classList.add('hidden');
  hudEl.classList.add('hidden');
  $('timeHud').classList.add('hidden');
  $('keyHint').classList.add('hidden');
  buildStageGrid();
  updateInvUI();
  menuEl.classList.remove('hidden');
}

function stageClear() {
  state = 'clear';
  sfx.clear();
  if (stageIdx + 1 >= unlocked) {
    unlocked = Math.min(stageIdx + 2, STAGES.length);
    localStorage.setItem(LS_UNLOCK, String(unlocked));
  }
  // 클리어 타임 기록
  const prev = bestTimes[stageIdx];
  const isRec = !prev || stageTime < prev;
  if (isRec) {
    bestTimes[stageIdx] = Math.round(stageTime * 10) / 10;
    localStorage.setItem('bb3d-times', JSON.stringify(bestTimes));
  }
  $('clearTime').innerHTML = `⏱ ${fmtT(stageTime)}` +
    (isRec ? ' <span class="newRecord">신기록!</span>' : ` <span style="opacity:.7">(최고 ${fmtT(prev)})</span>`);
  hudEl.classList.add('hidden');
  $('timeHud').classList.add('hidden');
  $('keyHint').classList.add('hidden');
  joy = null; joyBase.style.display = joyNub.style.display = 'none';
  updateInvUI();
  if (stageIdx === STAGES.length - 1) {
    allclearEl.classList.remove('hidden');
  } else {
    $('clearName').textContent = `${stageIdx + 1}. ${STAGES[stageIdx].name}`;
    clearEl.classList.remove('hidden');
  }
}

function pauseGame() { state = 'paused'; pausedEl.classList.remove('hidden'); }
function resumeGame() { state = 'playing'; pausedEl.classList.add('hidden'); lastT = performance.now(); }

$('nextBtn').addEventListener('click', () => startStage(stageIdx + 1));
$('clearRetryBtn').addEventListener('click', () => startStage(stageIdx));
$('listBtn').addEventListener('click', toMenu);
$('allListBtn').addEventListener('click', toMenu);
$('pauseListBtn').addEventListener('click', toMenu);
$('resumeBtn').addEventListener('click', () => { sfx.ui(); resumeGame(); });
$('retryHud').addEventListener('click', () => { if (state === 'playing') { sfx.ui(); resetStage(); } });
$('useBtn').addEventListener('click', useItem);
$('rotL').addEventListener('click', () => rotateCam(1));
$('rotR').addEventListener('click', () => rotateCam(-1));
// 🗺️ 홀드: 누르는 동안만 전체 보기
const mapBtn = $('mapBtn');
mapBtn.addEventListener('pointerdown', e => { e.preventDefault(); overview = true; });
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) {
  mapBtn.addEventListener(ev, () => overview = false);
}
document.addEventListener('visibilitychange', () => {
  if (!HEADLESS && document.hidden && state === 'playing') pauseGame();
});

function updateHUD() {
  $('stageName').textContent = `${stageIdx + 1}. ${STAGES[stageIdx].name}`;
  $('starCnt').textContent = `★ ${starsGot}/${starsTotal}`;
}

let hintTimer = null;
function showHint(msg) {
  const h = $('hint');
  h.textContent = msg;
  h.style.opacity = 1;
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => h.style.opacity = 0, 1400);
}

function killBall(cause) {
  dead = true; deadTimer = 0;
  sfx.die(); shake = 0.5;
  ballMat.color.set(0x777777);
  if (cause === 'spike') {
    ball.vy = 5; ball.vx *= 0.2; ball.vz *= 0.2;
    burst(ball.x, ball.y, ball.z, 0xe84f4f, 14, 5);
  }
  const f = $('flash');
  f.style.transition = 'none'; f.style.opacity = 0.35;
  setTimeout(() => { f.style.transition = 'opacity .5s'; f.style.opacity = 0; }, 30);
}

// ───────────────────────── 루프 ─────────────────────────
let lastT = performance.now();
let camPos = new THREE.Vector3(0, 8, 7);
let camLook = new THREE.Vector3(0, 0, 0);

function tick(now) {
  schedule(tick);
  const dt = Math.min((now - lastT) / 1000, 0.033);
  lastT = now;
  if (state === 'paused') return;
  const t = now / 1000;

  // 이동 블록 위치 갱신 (공은 자동으로 실리지 않음 — 직접 조작해서 발판을 따라가야 함)
  // moverT는 스테이지 리셋마다 0부터 → 매 시도 발판 패턴이 완전히 동일
  moverT += dt;
  for (const b of blocks) {
    if (!b.mover) continue;
    const off = Math.sin(moverT * 1.1 + b.phase) * (b.amp || 1.2);
    if (b.axis === 'x') { b.wx = b.base + off; b.mesh.position.x = b.wx; }
    else { b.wz = b.base + off; b.mesh.position.z = b.wz; }
  }

  if (state === 'playing' && ball && !dead) {
    stageTime += dt;
    $('timeHud').textContent = fmtT(stageTime);
    const [ix, iz] = inputVector();
    const ilen = Math.hypot(ix, iz);
    if (ilen > 0.2) lastDir = [ix / ilen, iz / ilen];

    if (ball.dashT > 0) {
      // 대시 중: 수평 돌진, 중력 무시
      ball.dashT -= dt;
      ball.vx = ball.dashX * DASH_SPD;
      ball.vz = ball.dashZ * DASH_SPD;
      ball.vy = 0;
    } else {
      ball.vx += (ix * SPEED - ball.vx) * Math.min(1, 10 * dt);
      ball.vz += (iz * SPEED - ball.vz) * Math.min(1, 10 * dt);
      ball.vy -= GRAV * dt;
    }
    const prevY = ball.y;
    ball.x += ball.vx * dt;
    ball.z += ball.vz * dt;
    ball.y += ball.vy * dt;

    // 착지 충돌 (벽 판정보다 먼저 — 위에서 내려앉을 땐 착지가 우선)
    // 가시와 돌이 붙어 있는 구간이 있으므로 후보 중 '가장 높은 → 가장 가까운' 블록에 착지
    if (ball.vy < 0) {
      let landB = null, landD = 1e9;
      for (const b of blocks) {
        if (!b.alive) continue;
        const top = b.top;
        if (prevY - R >= top - 0.04 && ball.y - R <= top &&
            Math.abs(ball.x - b.wx) <= 0.5 + R * 0.55 &&
            Math.abs(ball.z - b.wz) <= 0.5 + R * 0.55) {
          const dd = (ball.x - b.wx) ** 2 + (ball.z - b.wz) ** 2;
          if (!landB || b.top > landB.top + 0.01 ||
              (Math.abs(b.top - landB.top) <= 0.01 && dd < landD)) { landB = b; landD = dd; }
        }
      }
      if (landB) {
        const b = landB, top = b.top;
        if (b.type === 'spike') { killBall('spike'); }
        else {
          ball.y = top + R;
          if (b.type === 'spring') {
            ball.vy = SPRING_V;
            sfx.spring(); shake = 0.2;
            burst(ball.x, top, ball.z, 0xb06df2, 10, 4);
            if (b.springPad) b.springPad.scale.y = 2.4;
          } else {
            ball.vy = BOUNCE_V;
            sfx.bounce();
          }
          if (b.type === 'brk') { b.alive = false; b.breaking = 0.001; sfx.brk(); burst(ball.x, top, ball.z, 0xe0a050, 8, 3); }
          if (b.type === 'exit') {
            if (exitObj.open) { ballMesh.visible = true; stageClear(); }
            else showHint(`별을 모두 모아야 열려요! ★ ${starsGot}/${starsTotal}`);
          }
          squash = 1;
        }
      }
    }

    // 벽 충돌 (공 바닥보다 높은 블록의 옆면에 부딪힐 때만)
    for (const b of blocks) {
      if (!b.alive || b.top <= 0.02) continue;
      if (b.top <= ball.y - R + 0.03) continue;   // 공 바닥이 블록 위 → 벽 아님
      if (prevY - R > b.top - 0.08) continue;     // 위에서 내려앉는 중 → 착지 판정에 맡김
      const dx = ball.x - b.wx, dz = ball.z - b.wz;
      const half = 0.5 + R * 0.5;
      if (Math.abs(dx) < half && Math.abs(dz) < half) {
        const px = half - Math.abs(dx), pz = half - Math.abs(dz);
        if (px < pz) ball.x = b.wx + Math.sign(dx || 1) * half;
        else ball.z = b.wz + Math.sign(dz || 1) * half;
        ball.vx *= 0.5; ball.vz *= 0.5;
      }
    }

    // 별 수집 (원기둥 판정: 튀는 중 지나가도 먹히도록 수직으로 너그럽게)
    for (const s of stars) {
      if (s.got) continue;
      const dx = ball.x - s.mesh.position.x, dy = ball.y - s.mesh.position.y, dz = ball.z - s.mesh.position.z;
      if (dx * dx + dz * dz < 0.55 * 0.55 && Math.abs(dy) < 1.5) {
        s.got = true; s.mesh.visible = false;
        starsGot++;
        sfx.star();
        burst(s.mesh.position.x, s.mesh.position.y, s.mesh.position.z, 0xffd233, 10, 3);
        updateHUD();
        if (starsGot === starsTotal && exitObj) { setExit(true); sfx.open(); showHint('EXIT가 열렸어요!'); }
      }
    }

    // 아이템 수집 (같은 종류는 이미 보유 시 효과 없이 사라짐)
    for (const it of items) {
      if (it.got) continue;
      const dx = ball.x - it.mesh.position.x, dy = ball.y - it.mesh.position.y, dz = ball.z - it.mesh.position.z;
      if (dx * dx + dz * dz < 0.55 * 0.55 && Math.abs(dy) < 1.5) {
        it.got = true; it.mesh.visible = false;
        inv[it.itype] = true;
        lastTint = ITEM_DEF[it.itype].color;
        ballMat.color.set(lastTint);   // 공은 가장 나중에 먹은 아이템 색
        sfx.star();
        burst(it.mesh.position.x, it.mesh.position.y, it.mesh.position.z, ITEM_DEF[it.itype].color, 10, 3);
        updateInvUI();
      }
    }

    // 추락
    if (ball.y < -7) killBall('fall');
  }

  if (dead) {
    deadTimer += dt;
    ball.vy -= GRAV * dt;
    ball.y += ball.vy * dt;
    ball.x += ball.vx * dt; ball.z += ball.vz * dt;
    if (deadTimer > 0.75 && state === 'playing') resetStage();
  }

  // 1회용 블록 붕괴 애니메이션
  for (const b of blocks) {
    if (b.breaking > 0) {
      b.breaking += dt;
      b.mesh.position.y = -0.25 - b.breaking * b.breaking * 14;
      b.mesh.rotation.x += dt * 2.5;
      const s = Math.max(0.01, 1 - b.breaking);
      b.mesh.scale.setScalar(s);
      if (b.breaking > 1) b.mesh.visible = false;
    }
    if (b.springPad) {
      b.springPad.scale.y += (1 - b.springPad.scale.y) * Math.min(1, 10 * dt);
    }
  }

  // 별 회전/부유
  for (const s of stars) {
    if (s.got) continue;
    s.mesh.rotation.y += dt * 2.2;
    s.mesh.position.y = s.block.top + 0.85 + Math.sin(t * 2.5 + s.block.gx) * 0.08;
  }
  // 아이템 회전/부유
  for (const it of items) {
    if (it.got) continue;
    it.mesh.rotation.y += dt * 2.8;
    it.mesh.position.y = it.block.top + 0.85 + Math.sin(t * 2.5 + it.block.gx * 1.3) * 0.08;
  }
  // 체크포인트 깃발 흔들림
  if (cpMesh.visible) cpMesh.rotation.y = Math.sin(t * 2) * 0.2;
  // EXIT 링 회전
  if (exitObj) {
    exitObj.ring.rotation.z += dt * (exitObj.open ? 2.5 : 0.5);
    if (exitObj.open) exitObj.pad.material.emissive.setScalar(0.15 + Math.sin(t * 5) * 0.1);
  }

  // 파티클
  for (let i = particles.length - 1; i >= 0; i--) {
    const m = particles[i];
    m.userData.life -= dt;
    m.userData.v.y -= 10 * dt;
    m.position.addScaledVector(m.userData.v, dt);
    m.material.opacity = Math.max(0, m.userData.life / 0.55);
    if (m.userData.life <= 0) { scene.remove(m); m.material.dispose(); particles.splice(i, 1); }
  }

  // 공 표시
  if (ball) {
    ballMesh.position.set(ball.x, ball.y, ball.z);
    ball.spin += (Math.abs(ball.vx) + Math.abs(ball.vz)) * dt + dt * 2;
    stripe.rotation.z = ball.spin;
    ballMesh.rotation.z = -ball.vx * 0.06;
    ballMesh.rotation.x = ball.vz * 0.06;
    squash = Math.max(0, squash - dt * 6);
    const sq = 1 - squash * 0.35;
    ballMesh.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));

    // 그림자
    let shY = null;
    for (const b of blocks) {
      if (!b.alive) continue;
      if (b.top <= ball.y && Math.abs(ball.x - b.wx) <= 0.55 && Math.abs(ball.z - b.wz) <= 0.55) {
        if (shY === null || b.top > shY) shY = b.top;
      }
    }
    if (shY !== null && !dead) {
      shadowMesh.visible = true;
      shadowMesh.position.set(ball.x, shY + 0.012, ball.z);
      const d = Math.min(1, (ball.y - shY) / 5);
      shadowMesh.material.opacity = 0.32 * (1 - d * 0.75);
      shadowMesh.scale.setScalar(1 - d * 0.45);
    } else shadowMesh.visible = false;

    // 카메라
    shake = Math.max(0, shake - dt * 2);
    // 카메라 회전각 보간
    let dyaw = camYawTarget - camYaw;
    camYaw += dyaw * Math.min(1, 8 * dt);
    let want, lookW;
    if (overview && state === 'playing') {
      // 전체 보기: 스테이지 위에서 내려다봄 (누르는 동안만)
      const [ox, oz] = rotY(0, 0.6, camYaw);
      want = new THREE.Vector3(stageCenter.x + ox, overviewH, stageCenter.z + oz);
      lookW = new THREE.Vector3(stageCenter.x, 0, stageCenter.z);
    } else {
      const ty = Math.max(0, ball.y * 0.25);
      const [cox, coz] = rotY(0, 6.6 * camZoom, camYaw);
      want = new THREE.Vector3(ball.x + cox, ty + 7.2 * camZoom, ball.z + coz);
      const [lox, loz] = rotY(0, -0.9, camYaw);
      lookW = new THREE.Vector3(ball.x + lox, ty + 0.3, ball.z + loz);
    }
    camPos.lerp(want, Math.min(1, 6 * dt));
    camLook.lerp(lookW, Math.min(1, 6 * dt));
    camera.position.set(
      camPos.x + (Math.random() - 0.5) * shake,
      camPos.y + (Math.random() - 0.5) * shake,
      camPos.z
    );
    camera.lookAt(camLook);
  }

  renderer.render(scene, camera);
}

// ───────────────────────── 시작 ─────────────────────────
if (HEADLESS) {
  // 자동 테스트용 읽기/조작 훅 (headless 모드에서만 노출)
  window.__bb = {
    get ball() { return ball; }, get state() { return state; },
    get starsGot() { return starsGot; }, get starsTotal() { return starsTotal; },
    get exitOpen() { return exitObj ? exitObj.open : false; },
    get stageIdx() { return stageIdx; },
    get inv() { return Object.keys(inv); },
    get cpSet() { return !!checkpoint; },
    get maps() { return STAGES.map(s => s.map); },
    get starPos() { return stars.filter(s => !s.got).map(s => [s.mesh.position.x, s.mesh.position.z]); },
    get exitPos() { return exitObj ? [exitObj.block.wx, exitObj.block.wz] : null; },
    start: i => startStage(i),
    use: () => useItem(),
  };
}
loadStage(0);            // 메뉴 배경용
state = 'menu';
buildStageGrid();
schedule(tick);
</script>
</body>
